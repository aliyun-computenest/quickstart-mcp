ROSTemplateFormatVersion: '2015-09-01'
Conditions:
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption
Parameters:
  HigressAI:
    Type: String
    AssociationProperty: ALIYUN::APIG::Gateway::GatewayId
    AssociationPropertyMetadata:
      GatewayType: AI
      RegionId:
        Ref: ALIYUN::Region
    Label:
      zh-cn: AI网关
      en: AI Gateway
  HigressDomainId:
    Type: String
    AssociationProperty: ALIYUN::APIG::Gateway::ListDomains
    Required: true
    AssociationPropertyMetadata:
      GatewayType: AI
    Label:
      zh-cn: AI域名
      en: AI DomainId
  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Required: true
    Default: NewOSS
  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}
  InternetMaxBandwidthOut:
    Type: Number
    Label:
      zh-cn: 公网带宽 (Mbps)
      en: Internet Max Bandwidth Out (Mbps)
    MinValue: 1
    MaxValue: 100
    Default: 8
  InternetChargeType:
    Type: String
    Label:
      zh-cn: 带宽付费类型
      en: Internet Charge Type
    AssociationPropertyMetadata:
      ValueLabelMapping:
        PayByTraffic: 按流量计费
        PayByBandwidth: 按固定带宽计费
    AllowedValues:
      - PayByBandwidth
      - PayByTraffic
    Default: PayByTraffic
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: ALIYUN::MCP::Server::Server
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCount: 6
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
    AllowedValues:
      - ecs.u1-c1m2.large
      - ecs.u1-c1m4.large
      - ecs.u1-c1m1.xlarge
      - ecs.u1-c1m2.xlarge
      - ecs.u1-c1m4.xlarge
      - ecs.u1-c1m1.2xlarge
      - ecs.u1-c1m2.3xlarge
      - ecs.u1-c1m1.4xlarge
      - ecs.e-c1m2.xlarge
      - ecs.e-c1m4.large
Resources:
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="
  ExistVsw:
    Type: DATASOURCE::VPC::VSwitch
    Properties:
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ExtensionDataSource
              - VSwitch
  ExtensionDataSource:
    Type: DATASOURCE::APIG::Gateway
    Properties:
      GatewayId:
        Ref: HigressAI
  OSSBucket:
    Type: 'ALIYUN::OSS::Bucket'
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      Policy:
        Version: "1"
        Statement:
          - Effect: "Allow"
            Action:
              - "oss:GetObject"
              - "oss:PutObject"
              - "oss:GetObjectAcl"
              - "oss:PutObjectAcl"
              - "oss:AbortMultipartUpload"
              - "oss:ListParts"
              - "oss:RestoreObject"
              - "oss:GetVodPlaylist"
              - "oss:PostVodPlaylist"
              - "oss:PublishRtmpStream"
              - "oss:ListObjectVersions"
              - "oss:GetObjectVersion"
              - "oss:GetObjectVersionAcl"
              - "oss:RestoreObjectVersion"
            Principal:
              - Ref: ALIYUN::AccountId  # 执行者账号ID（可能是子账号）
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}/*"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Ref: ALIYUN::StackName
                        - Ref: BucketName
          - Effect: "Allow"
            Action:
              - "oss:ListObjects"
            Principal:
              - Ref: ALIYUN::AccountId  # 执行者账号ID（可能是子账号）
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Ref: ALIYUN::StackName
                        - Ref: BucketName
            Condition:
              StringLike:
                "oss:Prefix":
                  - "*"

      BucketName:
        Ref: ALIYUN::StackName
  EcsRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: HigressRole-${ALIYUN::StackId}
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Fn::Sub: HigressEcsPolicy-${ALIYUN::StackId}
          PolicyDocument:
            Statement:
              - Action:
                  - ram:CreateServiceLinkedRole
                Resource:
                  - '*'
                Effect: Allow
                Condition:
                  StringEquals:
                    ram:ServiceName:
                      - supplier.computenest.aliyuncs.com
              - Action:
                  - oss:*
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
              - Action:
                  - apig:*
                  - ram:GetRole
                Resource:
                  - '*'
                Effect: Allow
            Version: '1'

  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ExtensionDataSource
              - Vpc
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ExtensionDataSource
              - Vpc
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ExtensionDataSource
              - VSwitch
      ZoneId:
        Fn::GetAtt:
          - ExistVsw
          - ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId: ecs_image_quickstart-mcp
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      RamRoleName:
        Fn::GetAtt:
          - EcsRole
          - RoleName
      SystemDiskSize: 40
      InternetMaxBandwidthOut:
        Ref: InternetMaxBandwidthOut
      InternetChargeType:
        Ref: InternetChargeType
      IoOptimized: optimized
      MaxAmount: 1
  RunInstallCommand:
    Type: ALIYUN::ECS::RunCommandOfLifespan
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - InstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            set -e
            wget -O /root/pre-mcp-tools.json https://service-info-public.oss-cn-hangzhou.aliyuncs.com/mcp/mcp-tools.json
            cpu_cores=$(nproc)
            workers=$((cpu_cores * 2))
            cd /root
            cat > config.json << EOF
            ${MCP_RESULT}
            EOF
            #sed -i "s|\${!MCP_KEY}|${mcp_KEY}|g" /root/application/mcp/docker-compose-enterprise.yaml
            sed -i "s|\${!MCP_KEY}|${mcp_KEY}|g" /root/application/mcp/docker-compose-enterprise.yaml
            # 前置条件检查和ossutil安装
            if ! command -v ossutil64 &> /dev/null; then
              echo "安装ossutil..."
              sudo -v ; curl https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
            fi
            
            # 配置ossutil（通过实例RAM角色）
            cat > ~/.ossutilconfig << EOF
            [Credentials]
            endpoint = oss-${RegionId}-internal.aliyuncs.com
            region = ${RegionId}
            mode = EcsRamRole
            ecsRoleName = ${RamRoleName}
            EOF
            
            # 创建本地包目录。不存在才创建
            mkdir -p /root/mcp-package
            python download_oss.py ${BucketName} /root/config.json

            file_path="/etc/systemd/system/quickstart-mcp.service"
            if [ ! -f "$file_path" ]; then
            cat > $file_path <<EOF
            [Unit]
            Description=Docker Compose Application Service
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            WorkingDirectory=/root/application/mcp
            ExecStart=/usr/bin/docker compose -f docker-compose-enterprise.yaml up -d
            ExecStop=/usr/bin/docker compose down
            TimeoutStartSec=0

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl enable quickstart-mcp

            fi
            systemctl daemon-reload
            systemctl restart quickstart-mcp
            cd /root/application/mcp

            MAX_TIMEOUT=1800
            INTERVAL=10
            MAX_ATTEMPTS=$((MAX_TIMEOUT / INTERVAL))

            for ((i=1; i<=MAX_ATTEMPTS; i++))
              do
                if [ -f "/root/application/mcp/logs/mcpo.log" ]; then
                  LATEST_LOG=$(tail -n 10 /root/application/mcp/logs/mcpo.log 2>/dev/null)
                  if echo "$LATEST_LOG" | grep -q "Application startup complete"
                    then
                      echo "success"
                      break
                    else
                      sleep $INTERVAL
                  fi
                else
                  sleep $INTERVAL
                fi
            done
            sleep 15

            chmod +x /root/application/mcp/openapi-to-mcp
            # 静默卸载 aliyun-cli
            yum remove aliyun-cli -y

            # 静默下载 aliyun-cli
            curl -s https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli-linux-latest.tgz

            # 静默解压 aliyun-cli
            tar xzf aliyun-cli-linux-latest.tgz
            ./aliyun configure set \
            --profile EcsProfile \
            --mode EcsRamRole \
            --ram-role-name ${RamRoleName} \
            --region ${RegionId}
            
            # 再新建
            python higress_enterprise.py register --gateway-id ${GatewayID} ${mcp_KEY} --private-ip ${private_ip} --domain-id "${DomainId}" --tools-config /root/config.json --region ${RegionId} --si {{ serviceInstanceId }} --mode create-skip
            sleep 10
          - RegionId:
              Ref: ALIYUN::Region
            mcp_KEY: ''
            MCP_RESULT:
              Fn::Jq:
                - First
                - '{mcpServers: map({ key: .serverCode, value: { command, args, env,type,url,packageOssPath,icon } }) | from_entries }'
                - Ref: McpConfigJson
            GatewayID:
              Ref: HigressAI
            RamRoleName:
              Fn::GetAtt:
                - EcsRole
                - RoleName
            private_ip:
              Fn::Sub:
                - ${ServerAddress}
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PrivateIps
            DomainId:
              Ref: HigressDomainId
            BucketName:
              Fn::If:
                - CreateOssConditions
                - Ref: ALIYUN::StackName
                - Ref: BucketName
      CommandContentOnDeletion:
        Fn::Sub:
          - |
            cd /root/application/mcp/
            python higress_enterprise.py cleanup --gateway-id ${GatewayID} --region ${RegionId} --si {{ serviceInstanceId }}
            sleep 10
          - RegionId:
              Ref: ALIYUN::Region
            GatewayID:
              Ref: HigressAI
Outputs:
  openapi_server_address:
    Label:
      en: 'MCP Control plane'
      zh-cn: MCP管控平台
    Value:
      Fn::Sub:
        - 'https://apig.console.aliyun.com/#/${RegionId}/ai-gateway/${GatewayId}/mcp-server?region=${RegionId}'
        - RegionId:
            Ref: ALIYUN::Region
          GatewayId:
            Ref: HigressAI
  InstancePassword:
    NoEcho: 'True'
    Label:
      en: Ecs Instance password
      zh-cn: ECS实例密码
    Description:
      en: Initial instance password
      zh-cn: ECS实例密码
    Value:
      Fn::GetAtt:
        - RandomPassword
        - value


Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - McpConfigJson
        Label:
          zh-cn: Mcp配置(可多选)
          en: Mcp Config
      - Parameters:
          - OssOption
          - BucketName
        Label:
          zh-cn: OSS存储配置
          en: OSS Storage Configuration
      - Parameters:
          - HigressAI
          - HigressDomainId
        Label:
          zh-cn:  Higress配置
          en: Higress Config
      - Parameters:
          - PayType
          - PayPeriodUnit
          - PayPeriod
        Label:
          default: 付费类型配置
      - Parameters:
          - EcsInstanceType
          - InternetChargeType
          - InternetMaxBandwidthOut
        Label:
          default: 资源配置
    QuickDeployConfig:
      PackageFields:
        - Key: EcsInstanceType
        - Key: InternetChargeType
          Label:
            zh-cn: 公网带宽
            en: Internet Charge Type
          Value: ${InternetChargeType } / ${InternetMaxBandwidthOut} Mbps
        - Key: PayType
          Label:
            zh-cn: 付费类型
            en: Pay Type
          Value: ${PayType}
        - Key: PayPeriodUnit
          Label:
            zh-cn: 付费时长
            en: Pay Period
          Value: ${PayPeriod} ${PayPeriodUnit}
      CostRelatedKeys:
        - RegionId
        - PayPeriod