ROSTemplateFormatVersion: '2015-09-01'

Mappings:
  PaymentTypeMapping:
    PayTypeMap:
      PostPaid: PayAsYouGo
      PrePaid: Subscription

Conditions:
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption

  CreateGatewayConditions:
    Fn::Equals:
      - NewGateway
      - Ref: GatewayOption

  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption

  CreateHiMarketConditions:
    Fn::Equals:
      - true
      - Ref: EnableHiMarket

Locals:
  # 当前时间戳
  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai

  # 获取实际使用的网关ID
  ActualGatewayId:
    Value:
      Fn::If:
        - CreateGatewayConditions
        - Fn::GetAtt:
            - NewApigGateway
            - GatewayId
        - Ref: HigressAI

  # 获取实际使用的域名ID
  ActualDomainId:
    Value:
      Fn::If:
        - CreateGatewayConditions
        - Fn::Jq:
            - First
            - '.[0].DomainId'
            - Fn::GetAtt:
                - NewApigGateway
                - Domains
        - Ref: HigressDomainId

  # 映射网关付费类型
  GatewayPaymentType:
    Value:
      Fn::FindInMap:
        - PaymentTypeMapping
        - PayTypeMap
        - Ref: PayType

  # 获取实际使用的VPC ID
  ActualVpcId:
    Value:
      Fn::If:
        - CreateVpcConditions
        - Ref: EcsVpc
        - Fn::If:
            - CreateGatewayConditions
            - Fn::GetJsonValue:
                - VpcId
                - Fn::GetAtt:
                    - ExtensionDataSource
                    - Vpc
            - Ref: VpcId

  # 获取实际使用的VSwitch ID
  ActualVSwitchId:
    Value:
      Fn::If:
        - CreateVpcConditions
        - Ref: PrimaryEcsVSwitch
        - Fn::If:
            - CreateGatewayConditions
            - Fn::GetJsonValue:
                - VSwitchId
                - Fn::GetAtt:
                    - ExtensionDataSource
                    - VSwitch
            - Ref: PrimaryVSwitchId

Parameters:
  EnableHiMarket:
    Type: Boolean
    Label:
      en: Enable HiMarket
      zh-cn: 启用HiMarket
    Description:
      zh-cn: <font color='green'>可帮助快速构建企业级的 MCP 能力市场，包含一下两部分。<br>1. MCP 开放平台管理后台 (for 管理员/运营)<br>2. MCP 开放平台门户 (for 开发者/企业内部用户)<br>可访问<a href='https://github.com/higress-group/himarket' target='_blank'>GitHub</a>查看具体信息</font>
      en: <font color='green'>Helps quickly build enterprise-level AI capability marketplace.<br>1. AI Open Platform Management Backend (for administrators/operators)<br>2. AI Open Platform Portal (for developers/internal enterprise users)<br>Visit <a href='https://github.com/higress-group/himarket' target='_blank'>GitHub</a> for more information</font>
    Default: false
  GatewayOption:
    Type: String
    AllowedValues:
      - ExistingGateway
      - NewGateway
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingGateway:
          zh-cn: 使用已有AI网关
          en: Use Existing AI Gateway
        NewGateway:
          zh-cn: 新建AI网关
          en: Create New AI Gateway
    Label:
      en: AI Gateway Option
      zh-cn: AI网关选项
    Description:
      zh-cn: <font color='green'>统一的MCP流量，鉴权入口<br>AI网关作为MCP服务的统一接入点，提供流量管理和身份验证功能</font>
      en: <font color='green'>Unified MCP traffic and authentication entry<br>AI Gateway serves as a unified access point for MCP services, providing traffic management and authentication functions</font>
    Required: true
    Default: ExistingGateway

  HigressAI:
    Type: String
    Required:
      Fn::Equals:
        - ExistingGateway
        - ${GatewayOption}
    AssociationProperty: ALIYUN::APIG::Gateway::GatewayId
    AssociationPropertyMetadata:
      GatewayType: AI
      RegionId:
        Ref: ALIYUN::Region
      Visible:
        Condition:
          Fn::Equals:
            - ExistingGateway
            - ${GatewayOption}
    Default: ""
    Label:
      zh-cn: 已有AI网关
      en: Existing AI Gateway
    Description:
      zh-cn: 选择已有的AI网关实例ID
      en: Select existing AI Gateway instance ID

  HigressDomainId:
    Type: String
    Required: true
    AssociationProperty: ALIYUN::APIG::Gateway::ListDomains
    AssociationPropertyMetadata:
      GatewayType: AI
    Label:
      zh-cn: AI域名
      en: AI DomainId
    Description:
      zh-cn: AI网关域名ID，用于路由配置
      en: AI Gateway domain ID for route configuration

  GatewaySpec:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    Default: "aigw.small.x1"
    AllowedValues:
      - "aigw.small.x1"
      - "aigw.medium.x1"
      - "aigw.large.x1"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}
    Label:
      zh-cn: 网关规格
      en: Gateway Specification
    Description:
      zh-cn: AI网关实例规格
      en: AI Gateway instance specification

  # 主可用区ID
  PrimaryZoneId:
    Type: String
    Label:
      en: Primary Zone ID
      zh-cn: 可用区ID
    Description:
      zh-cn: 主可用区，用于创建主交换机
      en: Primary zone , used to create primary VSwitch
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    AssociationPropertyMetadata:
      DefaultValueStrategy: random
    Required: true

  VpcOption:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    AllowedValues:
      - ExistingVPC
      - NewVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingVPC:
          zh-cn: 使用已有VPC
          en: Use Existing VPC
        NewVPC:
          zh-cn: 新建VPC
          en: Create New VPC
    Label:
      en: VPC Option
      zh-cn: VPC选项
    Default: NewVPC

  VpcId:
    Type: String
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::ECS::VPC::VPCId
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Label:
      zh-cn: VPC ID
      en: VPC ID
    Description:
      zh-cn: 选择已有的VPC
      en: Select existing VPC

  PrimaryVSwitchId:
    Type: String
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::VSwitchId
    Default: ''
    AssociationPropertyMetadata:
      VpcId: ${VpcId}
      ZoneId: ${PrimaryZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Label:
      zh-cn: 主交换机ID
      en: Primary VSwitch ID
    Description:
      zh-cn: 选择主可用区的交换机
      en: Select VSwitch in primary zone

  VpcCidrBlock:
    Type: String
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    Default: "192.168.0.0/16"
    AllowedValues:
      - "192.168.0.0/16"
      - "172.16.0.0/12"
      - "10.0.0.0/8"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Label:
      zh-cn: VPC网段
      en: VPC CIDR Block
    Description:
      zh-cn: 新建VPC的网段
      en: CIDR block for new VPC

  PrimaryVSwitchCidrBlock:
    Type: String
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    Default: "192.168.1.0/24"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Label:
      zh-cn: 主交换机网段
      en: Primary VSwitch CIDR Block
    Description:
      zh-cn: 新建主交换机的网段
      en: CIDR block for new primary VSwitch
  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Description:
      zh-cn: <font color='green'>用于存储企业内部MCP Package。<br>如使用已有的OSS，请在部署后参考服务实例文档为相关账号授予权限。</font>
      en: <font color='green'>Used to store enterprise internal MCP Packages.<br>If using an existing OSS, please refer to the service instance documentation after deployment.</font>
    Required: true
    Default: NewOSS

  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}

  InternetMaxBandwidthOut:
    Type: Number
    Label:
      zh-cn: 公网带宽 (Mbps)
      en: Internet Max Bandwidth Out (Mbps)
    MinValue: 1
    MaxValue: 100
    Default: 8

  InternetChargeType:
    Type: String
    Label:
      zh-cn: 带宽付费类型
      en: Internet Charge Type
    AssociationPropertyMetadata:
      ValueLabelMapping:
        PayByTraffic: 按流量计费
        PayByBandwidth: 按固定带宽计费
    AllowedValues:
      - PayByBandwidth
      - PayByTraffic
    Default: PayByTraffic

  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: ALIYUN::MCP::Server::Server
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCount: 6

  # 统一的付费类型参数
  PayType:
    Type: String
    Label:
      en: Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType

  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid

  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid

  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
    AllowedValues:
      - ecs.u1-c1m4.large
      - ecs.u1-c1m1.xlarge
      - ecs.u1-c1m2.xlarge
      - ecs.u1-c1m4.xlarge
      - ecs.u1-c1m1.2xlarge
      - ecs.u1-c1m2.3xlarge
      - ecs.u1-c1m1.4xlarge
      - ecs.e-c1m2.xlarge
      - ecs.e-c1m4.large
    Default: ecs.u1-c1m1.xlarge



Resources:
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="

  # 新建VPC（当选择新建VPC时）
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Fn::Sub: "${ALIYUN::StackName}-vpc"
      CidrBlock:
        Ref: VpcCidrBlock

  # 新建主VSwitch（当选择新建VPC时）
  PrimaryEcsVSwitch:
    Type: ALIYUN::ECS::VSwitch
    Condition: CreateVpcConditions
    Properties:
      VSwitchName:
        Fn::Sub: "${ALIYUN::StackName}-primary-vswitch"
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: PrimaryZoneId
      CidrBlock:
        Ref: PrimaryVSwitchCidrBlock

  # 新建AI网关
  NewApigGateway:
    Type: ALIYUN::APIG::Gateway
    Condition: CreateGatewayConditions
    Properties:
      GatewayName:
        Ref: ALIYUN::StackName
      GatewayType: "AI"
      PaymentType:
        Ref: GatewayPaymentType
      Period:
        Ref: PayPeriod
      PeriodUnit:
        Ref: PayPeriodUnit
      Spec:
        Ref: GatewaySpec
      ZoneConfig:
        SelectOption: "Auto"
      NetworkAccessConfig:
        Type: "InternetAndIntranet"
      Vpc:
        VpcId:
          Fn::If:
            - CreateVpcConditions
            - Ref: EcsVpc
            - Ref: VpcId
      VSwitch:
        VSwitchId:
          Fn::If:
            - CreateVpcConditions
            - Ref: PrimaryEcsVSwitch
            - Ref: PrimaryVSwitchId

  # 查询网关详情，获取VPC、VSwitch、SecurityGroup等信息
  ExtensionDataSource:
    Type: DATASOURCE::APIG::Gateway
    Properties:
      GatewayId:
        Ref: ActualGatewayId

  ExistVsw:
    Type: DATASOURCE::VPC::VSwitch
    Properties:
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ExtensionDataSource
              - VSwitch

  OSSBucket:
    Type: 'ALIYUN::OSS::Bucket'
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      Policy:
        Version: "1"
        Statement:
          - Effect: "Allow"
            Action:
              - "oss:GetObject"
              - "oss:PutObject"
              - "oss:GetObjectAcl"
              - "oss:PutObjectAcl"
              - "oss:AbortMultipartUpload"
              - "oss:ListParts"
              - "oss:RestoreObject"
              - "oss:GetVodPlaylist"
              - "oss:PostVodPlaylist"
              - "oss:PublishRtmpStream"
              - "oss:ListObjectVersions"
              - "oss:GetObjectVersion"
              - "oss:GetObjectVersionAcl"
              - "oss:RestoreObjectVersion"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}/*"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Ref: ALIYUN::StackName
                        - Ref: BucketName
          - Effect: "Allow"
            Action:
              - "oss:ListObjects"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Ref: ALIYUN::StackName
                        - Ref: BucketName
            Condition:
              StringLike:
                "oss:Prefix":
                  - "*"
      BucketName:
        Ref: ALIYUN::StackName

  EcsRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: HigressRole-${ALIYUN::StackId}
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Fn::Sub: HigressEcsPolicy-${ALIYUN::StackId}
          PolicyDocument:
            Statement:
              - Action:
                  - ram:CreateServiceLinkedRole
                Resource:
                  - '*'
                Effect: Allow
                Condition:
                  StringEquals:
                    ram:ServiceName:
                      - supplier.computenest.aliyuncs.com
              - Action:
                  - oss:*
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
              - Action:
                  - apig:*
                  - ram:GetRole
                Resource:
                  - '*'
                Effect: Allow
            Version: '1'

  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ExtensionDataSource
              - Vpc
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  # HiMarket安全组
  HiMarketSecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Condition: CreateHiMarketConditions
    Properties:
      SecurityGroupName:
        Fn::Sub: "${ALIYUN::StackName}-himarket"
      VpcId:
        Ref: ActualVpcId
      SecurityGroupIngress:
        - PortRange: 5174/5174
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 5173/5173
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 80/80
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ExtensionDataSource
              - Vpc
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ExtensionDataSource
              - VSwitch
      ZoneId:
        Fn::GetAtt:
          - ExistVsw
          - ZoneId
      SecurityGroupId:
        Ref: SecurityGroup
      ImageId: ecs_image_quickstart-mcp
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      RamRoleName:
        Fn::GetAtt:
          - EcsRole
          - RoleName
      SystemDiskSize: 40
      InternetMaxBandwidthOut:
        Ref: InternetMaxBandwidthOut
      InternetChargeType:
        Ref: InternetChargeType
      IoOptimized: optimized
      MaxAmount: 1

  # HiMarket实例组
  HiMarketInstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Condition: CreateHiMarketConditions
    Properties:
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Ref: ActualVpcId
      VSwitchId:
        Ref: ActualVSwitchId
      ZoneId:
        Fn::If:
          - CreateVpcConditions
          - Ref: PrimaryZoneId
          - Fn::GetAtt:
              - ExistVsw
              - ZoneId
      SecurityGroupId:
        Ref: HiMarketSecurityGroup
      ImageId: ecs_image_himarket
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize: 40
      InternetMaxBandwidthOut:
        Ref: InternetMaxBandwidthOut
      InternetChargeType:
        Ref: InternetChargeType
      IoOptimized: optimized
      MaxAmount: 1
      DiskMappings:
        - Category: cloud_essd
          Size: 200
      # 数据盘初始化和挂载
      UserData: |
        #cloud-config
        bootcmd:
          - |
            #!/bin/bash
            function init_and_mount_data_disk() {
                disk_device="/dev/vdb"
                parted_disk_device="/dev/vdb1"
                mount_point="/data"
                # 已初始化的磁盘，跳过初始化，直接挂载
                if blkid -o value -s TYPE $disk_device &>/dev/null; then
                  echo "Disk is already initialized."
                else
                  echo "Disk is not initialized, initializing..."
                  cat >> /root/InitDataDisk.sh << "EOF"
            #!/bin/bash
            echo "p
            n
            p



            w
            " |  fdisk -u /dev/vdb
            EOF
                  /bin/bash /root/InitDataDisk.sh
                  rm -f /root/InitDataDisk.sh
                  mkfs -t ext4 $parted_disk_device
                fi

                cp /etc/fstab /etc/fstab.bak
                mkdir $mount_point
                echo `blkid $parted_disk_device | awk '{print $2}' | sed 's/\\\"//g'` $mount_point ext4 defaults 0 0 >> /etc/fstab
                mount -a
            }
            init_and_mount_data_disk

  RunInstallCommand:
    Type: ALIYUN::ECS::RunCommandOfLifespan
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - InstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            set -e
            wget -O /root/pre-mcp-tools.json https://service-info-public.oss-cn-hangzhou.aliyuncs.com/mcp/mcp-tools.json
            cpu_cores=$(nproc)
            workers=$((cpu_cores * 2))
            cd /root
            cat > config.json << EOF
            ${MCP_RESULT}
            EOF
            #sed -i "s|\${!MCP_KEY}|${mcp_KEY}|g" /root/application/mcp/docker-compose-enterprise.yaml
            sed -i "s|\${!MCP_KEY}|${mcp_KEY}|g" /root/application/mcp/docker-compose-enterprise.yaml
                        cd /root/application/mcp

            # 静默卸载 aliyun-cli
            yum remove aliyun-cli -y

            # 静默下载 aliyun-cli
            curl -s https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli-linux-latest.tgz

            # 静默解压 aliyun-cli
            tar xzf aliyun-cli-linux-latest.tgz
            ./aliyun configure set \
            --profile EcsProfile \
            --mode EcsRamRole \
            --ram-role-name ${RamRoleName} \
            --region ${RegionId}
            
            # 前置条件检查和ossutil安装
            if ! command -v ossutil &> /dev/null; then
              echo "安装ossutil..."
              curl -o ossutil-2.1.1-linux-amd64.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip
              unzip ossutil-2.1.1-linux-amd64.zip
              cd ossutil-2.1.1-linux-amd64
              chmod 755 ossutil
              sudo mv ossutil /usr/local/bin/ && sudo ln -s /usr/local/bin/ossutil /usr/bin/ossutil
            fi
            
            # 配置ossutil（通过实例RAM角色）
            if [ ! -f ~/.ossutilconfig ]; then
              echo "配置ossutil..."
            cat > ~/.ossutilconfig << EOF
            [Credentials]
            endpoint = oss-${RegionId}-internal.aliyuncs.com
            region = ${RegionId}
            mode = EcsRamRole
            ecsRoleName = ${RamRoleName}
            EOF
            fi
            
            # 创建本地包目录。不存在才创建
            mkdir -p /root/mcp-package
            cd /root/application/mcp

            python download_oss.py ${BucketName} /root/config.json

            file_path="/etc/systemd/system/quickstart-mcp.service"
            if [ ! -f "$file_path" ]; then
            cat > $file_path <<EOF
            [Unit]
            Description=Docker Compose Application Service
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            WorkingDirectory=/root/application/mcp
            ExecStart=/usr/bin/docker compose -f docker-compose-enterprise.yaml up -d
            ExecStop=/usr/bin/docker compose down
            TimeoutStartSec=0

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl enable quickstart-mcp

            fi
            systemctl daemon-reload
            systemctl restart quickstart-mcp
            cd /root/application/mcp

            MAX_TIMEOUT=1800
            INTERVAL=10
            MAX_ATTEMPTS=$((MAX_TIMEOUT / INTERVAL))

            for ((i=1; i<=MAX_ATTEMPTS; i++))
              do
                if [ -f "/root/application/mcp/logs/mcpo.log" ]; then
                  LATEST_LOG=$(tail -n 10 /root/application/mcp/logs/mcpo.log 2>/dev/null)
                  if echo "$LATEST_LOG" | grep -q "Application startup complete"
                    then
                      echo "success"
                      break
                    else
                      sleep $INTERVAL
                  fi
                else
                  sleep $INTERVAL
                fi
            done
            sleep 15

            chmod +x /root/application/mcp/openapi-to-mcp
            
            # 再新建
            python higress_enterprise.py register --gateway-id ${GatewayID} ${mcp_KEY} --private-ip ${private_ip} --domain-id "${DomainId}" --tools-config /root/config.json --region ${RegionId} --si {{ serviceInstanceId }} --mode create-skip
            sleep 10
          - RegionId:
              Ref: ALIYUN::Region
            mcp_KEY: ''
            MCP_RESULT:
              Fn::Jq:
                - First
                - '{mcpServers: map({ key: .serverCode, value: { command, args, env,type,url,packageOssPath,icon } }) | from_entries }'
                - Ref: McpConfigJson
            GatewayID:
              Ref: ActualGatewayId
            RamRoleName:
              Fn::GetAtt:
                - EcsRole
                - RoleName
            private_ip:
              Fn::Sub:
                - ${ServerAddress}
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PrivateIps
            DomainId:
              Ref: ActualDomainId
            BucketName:
              Fn::If:
                - CreateOssConditions
                - Ref: ALIYUN::StackName
                - Ref: BucketName
      CommandContentOnDeletion:
        Fn::Sub:
          - |
            cd /root/application/mcp/
            python higress_enterprise.py cleanup --gateway-id ${GatewayID} --region ${RegionId} --si {{ serviceInstanceId }}
            sleep 10
          - RegionId:
              Ref: ALIYUN::Region
            GatewayID:
              Ref: ActualGatewayId

  # HiMarket安装命令
  HiMarketRunInstallCommand:
    Type: ALIYUN::ECS::RunCommand
    Condition: CreateHiMarketConditions
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - HiMarketInstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            # 创建开机自启动配置和状态检查脚本
            function create_systemd_config() {
                file_path="/etc/systemd/system/himarket.service"
                if [ -f "$file_path" ]; then
                    echo "Systemd配置已存在: $file_path"
                    return 1
                fi
                cat > $file_path <<EOF
            [Unit]
            Description=Docker Compose Application Service
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            WorkingDirectory=/root/application
            ExecStart=/bin/bash -c '/usr/bin/docker compose -f docker-compose.yaml up -d && /usr/local/bin/check-container-status'
            ExecStop=/usr/bin/docker compose down
            TimeoutStartSec=0

            [Install]
            WantedBy=multi-user.target
            EOF

                # 创建状态检查脚本
                cat > /usr/local/bin/check-container-status <<'EOF'
            #!/bin/bash
            COMPOSE_FILE="docker-compose.yaml"
            MAX_WAIT_TIME=3600
            CHECK_INTERVAL=10

            if ! command -v docker compose &> /dev/null; then
                echo "Error: docker compose is not installed"
                exit 1
            fi

            SERVICES=$(docker compose -f "$COMPOSE_FILE" config --services 2>/dev/null)
            if [ -z "$SERVICES" ]; then
                echo "Error: No services found"
                exit 1
            fi

            WAIT_TIME=0
            TIMEOUT_REACHED=false

            while [ $WAIT_TIME -le $MAX_WAIT_TIME ]; do
                ALL_HEALTHY=true
                for SERVICE in $SERVICES; do
                    CONTAINER_ID=$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE")

                    if [ -z "$CONTAINER_ID" ]; then
                        echo "[$SERVICE] Not running"
                        ALL_HEALTHY=false
                        continue
                    fi

                    INSPECT_OUTPUT=$(docker inspect --format \
                        '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                        "$CONTAINER_ID" 2>/dev/null)

                    STATUS=$(echo "$INSPECT_OUTPUT" | awk '{print $1}')
                    HEALTH_STATUS=$(echo "$INSPECT_OUTPUT" | awk '{print $2}')

                    case "$HEALTH_STATUS" in
                        "healthy") ;;
                        "unhealthy"|"starting")
                            echo "[$SERVICE] Unhealthy: $HEALTH_STATUS"
                            ALL_HEALTHY=false
                            ;;
                        "no-healthcheck")
                            [ "$STATUS" != "running" ] && ALL_HEALTHY=false
                            ;;
                        *)
                            echo "[$SERVICE] Unknown status: $HEALTH_STATUS"
                            ALL_HEALTHY=false
                            ;;
                    esac
                done

                $ALL_HEALTHY && exit 0
                [ $WAIT_TIME -ge $MAX_WAIT_TIME ] && break

                sleep $CHECK_INTERVAL
                WAIT_TIME=$((WAIT_TIME + CHECK_INTERVAL))
            done

            echo "Timeout reached! Abnormal services:" >&2
            docker compose -f "$COMPOSE_FILE" ps --all
            exit 1
            EOF

                chmod +x /usr/local/bin/check-container-status
                systemctl enable himarket
            
            }

            function create_custom_parameter_file() {
                echo "The custom parameter does not exist. Skip the processing"
            }

            function mount_data_disk_dir() {
                # 先计算出docker-compose.yaml的父目录
                docker_compose_parent_dir=$(dirname "/root/application/docker-compose.yaml")
                # 复制软件目录下目录和文件到数据盘挂载目录，加-n参数已存在则不进行复制
                cp -rn $docker_compose_parent_dir/* /data
                # sed替换挂载目录路径为数据盘目录
                cp $docker_compose_parent_dir/docker-compose.yaml $docker_compose_parent_dir/docker-compose.yaml.bak
                sed -i 's|\./|/data/|g' $docker_compose_parent_dir/docker-compose.yaml
                chmod -R 777 /data
            }

            #用于版本升级
            echo "当前时间：${CurTime}"
            create_systemd_config
            systemctl daemon-reload
            systemctl stop himarket
            create_custom_parameter_file
            mount_data_disk_dir
            systemctl start himarket
          - RegionId:
              Ref: ALIYUN::Region
            CurTime:
              Ref: CurTime

