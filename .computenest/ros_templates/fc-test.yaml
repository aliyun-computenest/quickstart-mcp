ROSTemplateFormatVersion: '2015-09-01'


Locals:
  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai

  # 计算MCP配置数量
  McpConfigCount:
    Type: Eval
    Value:
      Fn::Length:
        Ref: McpConfigJson

  # 提取serverCode数组
  ServerCodeArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - ".[] | .serverCode"
        - Ref: McpConfigJson

  # 构建配置类型数组
  ConfigTypeArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then "sse" 
          elif .command == "npx" and (.pkgType == "private") then "npx-private" 
          elif .command == "npx" then "npx-public" 
          elif .command == "uvx" and (.pkgType == "private") then "uvx-private" 
          elif .command == "uvx" then "uvx-public" 
          else "sse" 
          end
        - Ref: McpConfigJson

  # 构建Layers数组
  LayersArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | [
            if .command == "npx" then 
              "acs:fc:cn-hangzhou:official:layers/Nodejs-MCP/versions/2"
            elif .command == "uvx" and (.pkgType == "private") then 
              "acs:fc:cn-hangzhou:official:layers/Python312/versions/1"
            else 
              "acs:fc:cn-hangzhou:official:layers/Python3x-MCP/versions/4"
            end, 
            "acs:fc:cn-hangzhou:1730431480417716:layers/MCP-Runtime-V2/versions/1"
          ]
        - Ref: McpConfigJson

  # 构建Command数组
  CommandArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx -y " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          else 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          end
        - Ref: McpConfigJson

  # 构建OSS对象名数组
  OssObjectNameArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
            (.packageOssPath | ltrimstr("/")) 
          else 
            "flask-web-code.zip" 
          end
        - Ref: McpConfigJson

  # 获取OSS桶名（用于后续替换）
  OssBucketName:
    Value:
      Fn::If:
        - CreateOssConditions
        - Fn::GetAtt:
            - OSSBucket
            - Name
        - Ref: BucketName

  # 获取实际使用的网关ID
  ActualGatewayId:
    Value:
      Fn::If:
        - CreateGatewayConditions
        - Fn::GetAtt:
            - NewApigGateway
            - GatewayId
        - Ref: HigressAI

Parameters:
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: 'ALIYUN::MCP::Server::Server'
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCounts: 9
      ShowTagsCounts: 10


Resources:

  McpFunctions:
    Type: ALIYUN::FC3::Function
    Count:
      Ref: McpConfigCount
    Properties:
      FunctionName:
        Fn::Sub:
          - "${ServerCode}-${ALIYUN::StackName}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Handler: "index.handler"
      Runtime: "custom.debian12"
      MemorySize: 1024
      DiskSize: 512
      Timeout: 60
      InstanceConcurrency: 20
      InternetAccess: true
      Cpu: 1
      # 角色：所有函数都使用创建的角色
      Layers:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Ref: LayersArray
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Code:
        # OSS桶名：私有包使用创建的OSS，公开包使用默认OSS
        OssBucketName:
          Fn::Jq:
            - First
            - Fn::Sub:
                - |
                  if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
                    "${BucketName}" 
                  else 
                    "fc-layers-cn-hangzhou" 
                  end
                - BucketName: aab

            - Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: McpConfigJson
        # OSS对象名：使用预构建的对象名数组
        OssObjectName:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: OssObjectNameArray
      # OSS挂载配置：所有函数都挂载OSS到统一路径
      CustomRuntimeConfig:
        Port: 8080
        Command:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: CommandArray
      # 环境变量配置
      EnvironmentVariables:
        Fn::Jq:
          - First
          - Fn::Sub:
              - |
                . as $config | {
                  "LD_LIBRARY_PATH": "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib",
                  "PATH": (
                    if $config.command == "npx" then 
                      "/var/fc/lang/nodejs22/bin:/var/fc/lang/python3.13/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    else 
                      "/var/fc/lang/python3.13/bin:/var/fc/lang/nodejs22/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    end
                  ),
                  "PYTHONPATH": "/opt/python:/code",
                  "NODE_PATH": (
                    if $config.command == "npx" then 
                      "/opt/nodejs/node_modules" 
                    else 
                      null 
                    end
                  ),
                  "DEPLOY_TIME": "${DeployTime}",
                  "SERVER_CODE": $config.serverCode,
                  "CONFIG_TYPE": (
                    if $config.command == null then "sse" 
                    elif $config.command == "npx" and ($config.pkgType == "private") then "npx-private" 
                    elif $config.command == "npx" then "npx-public" 
                    elif $config.command == "uvx" and ($config.pkgType == "private") then "uvx-private" 
                    elif $config.command == "uvx" then "uvx-public" 
                    else "sse" 
                    end
                  )
                } + ($config.env // {})
              - DeployTime:
                  Ref: CurTime
          - Fn::Select:
              - Ref: ALIYUN::Index
              - Ref: McpConfigJson

  McpTriggers:
    Type: ALIYUN::FC3::Trigger
    Count:
      Ref: McpConfigCount
    DependsOn: McpFunctions
    Properties:
      FunctionName:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Fn::GetAtt:
              - McpFunctions
              - FunctionName
      TriggerType: "http"
      TriggerName: "defaultTrigger"
      Qualifier: "LATEST"
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        disableURLInternet: false



Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - McpConfigJson
        Label:
          default:
            zh-cn: MCP服务配置
            en: MCP Service Configuration
