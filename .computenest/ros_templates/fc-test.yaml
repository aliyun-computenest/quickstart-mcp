ROSTemplateFormatVersion: '2015-09-01'

Conditions:
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption

Locals:
  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai

  # 计算MCP配置数量
  McpConfigCount:
    Type: Eval
    Value:
      Fn::Length:
        Ref: McpConfigJson

  # 提取serverCode数组
  ServerCodeArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - ".[] | .serverCode"
        - Ref: McpConfigJson

  # 构建配置类型数组
  ConfigTypeArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then "sse" 
          elif .command == "npx" and (.pkgType == "private") then "npx-private" 
          elif .command == "npx" then "npx-public" 
          elif .command == "uvx" and (.pkgType == "private") then "uvx-private" 
          elif .command == "uvx" then "uvx-public" 
          else "sse" 
          end
        - Ref: McpConfigJson

  # 构建Layers数组
  LayersArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | [
            if .command == "npx" then 
              "acs:fc:cn-hangzhou:official:layers/Nodejs-MCP/versions/2" 
            elif .command == "uvx" and (.pkgType == "private") then 
              "acs:fc:cn-hangzhou:official:layers/Python312/versions/1" 
            else 
              "acs:fc:cn-hangzhou:official:layers/Python3x-MCP/versions/4" 
            end, 
            "acs:fc:cn-hangzhou:1730431480417716:layers/MCP-Runtime-V2/versions/1"
          ]
        - Ref: McpConfigJson

  # 构建Command数组
  CommandArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx -y " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          else 
            [
              "supergateway", 
              "--sse", 
              ("https://" + .serverCode + "-zwiyplvfcq.cn-hangzhou.fcapp.run/sse"), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          end
        - Ref: McpConfigJson

  # 构建OSS对象名数组
  OssObjectNameArray:
    Type: Eval
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
            (.packageOssPath | ltrimstr("/")) 
          else 
            "flask-web-code.zip" 
          end
        - Ref: McpConfigJson

  # 获取OSS桶名（用于后续替换）
  OssBucketName:
    Value:
      Fn::If:
        - CreateOssConditions
        - Fn::GetAtt:
            - OSSBucket
            - Name
        - Ref: BucketName

Parameters:
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: 'ALIYUN::MCP::Server::Server'
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCounts: 9
      ShowTagsCounts: 10

  HigressAI:
    Type: String
    Required: true
    AssociationProperty: ALIYUN::APIG::Gateway::GatewayId
    AssociationPropertyMetadata:
      GatewayType: AI
      RegionId:
        Ref: ALIYUN::Region
    Label:
      zh-cn: AI网关
      en: AI Gateway
    Description:
      zh-cn: AI网关实例ID，用于注册MCP服务
      en: AI Gateway instance ID for registering MCP services

  HigressDomainId:
    Type: String
    Required: true
    AssociationProperty: ALIYUN::APIG::Gateway::ListDomains
    AssociationPropertyMetadata:
      GatewayType: AI
    Label:
      zh-cn: AI域名
      en: AI DomainId
    Description:
      zh-cn: AI网关域名ID，用于路由配置
      en: AI Gateway domain ID for route configuration

  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Required: true
    Default: NewOSS

  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}

Resources:
  # 查询网关详情，获取VPC、VSwitch、SecurityGroup等信息
  ApigGateway:
    Type: DATASOURCE::APIG::Gateway
    Properties:
      GatewayId:
        Ref: HigressAI
  ExistVsw:
    Type: DATASOURCE::VPC::VSwitch
    Properties:
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ApigGateway
              - VSwitch
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ApigGateway
              - Vpc
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  # 创建OSS存储桶
  OSSBucket:
    Type: ALIYUN::OSS::Bucket
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      BucketName:
        Fn::Sub: "mcp-${ALIYUN::StackName}"
      Policy:
        Version: "1"
        Statement:
          - Effect: "Allow"
            Action:
              - "oss:GetObject"
              - "oss:PutObject"
              - "oss:GetObjectAcl"
              - "oss:PutObjectAcl"
              - "oss:AbortMultipartUpload"
              - "oss:ListParts"
              - "oss:RestoreObject"
              - "oss:GetVodPlaylist"
              - "oss:PostVodPlaylist"
              - "oss:PublishRtmpStream"
              - "oss:ListObjectVersions"
              - "oss:GetObjectVersion"
              - "oss:GetObjectVersionAcl"
              - "oss:RestoreObjectVersion"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}/*"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
          - Effect: "Allow"
            Action:
              - "oss:ListObjects"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
            Condition:
              StringLike:
                "oss:Prefix":
                  - "*"

  # 创建FC角色（所有函数都使用此角色）
  FcRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: "McpFcRole-${ALIYUN::StackName}"
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - fc.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Fn::Sub: "McpFcPolicy-${ALIYUN::StackName}"
          PolicyDocument:
            Statement:
              - Action:
                  - oss:GetObject
                  - oss:PutObject
                  - oss:ListObjects
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - "acs:oss:*:*:fc-layers-cn-hangzhou"
                  - "acs:oss:*:*:fc-layers-cn-hangzhou/*"
              - Action:
                  - vpc:DescribeVpcs
                  - vpc:DescribeVSwitches
                  - ecs:DescribeSecurityGroups
                Effect: Allow
                Resource:
                  - "*"
            Version: '1'

  # 创建HTTP API
  McpHttpApi:
    Type: ALIYUN::APIG::HttpApi
    Properties:
      HttpApiName:
        Fn::Sub: "mcp-api-${ALIYUN::StackName}"
      Type: "Http"
      Protocols:
        - "HTTP"
        - "HTTPS"
      BasePath: "/v1"
      Description: "MCP HTTP API"

  McpFunctions:
    Type: ALIYUN::FC3::Function
    Count:
      Ref: McpConfigCount
    DependsOn:
      - ApigGateway
      - FcRole
    Properties:
      FunctionName:
        Fn::Sub:
          - "${ServerCode}-${ALIYUN::StackName}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Handler: "index.handler"
      Runtime: "custom.debian12"
      MemorySize: 1024
      DiskSize: 512
      Timeout: 60
      InstanceConcurrency: 20
      InternetAccess: true
      Cpu: 1
      # 角色：所有函数都使用创建的角色
      Role:
        Fn::GetAtt:
          - FcRole
          - Arn
      Layers:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Ref: LayersArray
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Code:
        # OSS桶名：私有包使用创建的OSS，公开包使用默认OSS
        OssBucketName:
          Fn::Jq:
            - First
            - Fn::Sub:
                - |
                  if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
                    "${BucketName}" 
                  else 
                    "fc-layers-cn-hangzhou" 
                  end
                - BucketName:
                    Ref: OssBucketName
            - Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: McpConfigJson
        # OSS对象名：使用预构建的对象名数组
        OssObjectName:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: OssObjectNameArray
      # OSS挂载配置：所有函数都挂载OSS到统一路径
      OssMountConfig:
        MountPoints:
          - BucketName:
              Ref: OssBucketName
            BucketPath: "/mcp-package"
            ReadOnly: true
            MountDir: "/home/app"
            Endpoint: "https://oss-cn-hangzhou.aliyuncs.com"
      CustomRuntimeConfig:
        Port: 8080
        Command:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: CommandArray
      # VPC配置 - 直接使用网关的VPC信息
      VpcConfig:
        VpcId:
          Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc
        VSwitchIds:
          Fn::ListMerge:
            - - Fn::GetJsonValue:
                  - VSwitchId
                  - Fn::GetAtt:
                      - ApigGateway
                      - VSwitch
        SecurityGroupId:
          Ref: SecurityGroup
      # 环境变量配置
      EnvironmentVariables:
        Fn::Jq:
          - First
          - Fn::Sub:
              - |
                . as $config | {
                  "LD_LIBRARY_PATH": "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib",
                  "PATH": (
                    if $config.command == "npx" then 
                      "/var/fc/lang/nodejs22/bin:/var/fc/lang/python3.13/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    else 
                      "/var/fc/lang/python3.13/bin:/var/fc/lang/nodejs22/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    end
                  ),
                  "PYTHONPATH": "/opt/python:/code",
                  "NODE_PATH": (
                    if $config.command == "npx" then 
                      "/opt/nodejs/node_modules" 
                    else 
                      null 
                    end
                  ),
                  "DEPLOY_TIME": "${DeployTime}",
                  "SERVER_CODE": $config.serverCode,
                  "CONFIG_TYPE": (
                    if $config.command == null then "sse" 
                    elif $config.command == "npx" and ($config.pkgType == "private") then "npx-private" 
                    elif $config.command == "npx" then "npx-public" 
                    elif $config.command == "uvx" and ($config.pkgType == "private") then "uvx-private" 
                    elif $config.command == "uvx" then "uvx-public" 
                    else "sse" 
                    end
                  )
                } + ($config.env // {})
              - DeployTime:
                  Ref: CurTime
          - Fn::Select:
              - Ref: ALIYUN::Index
              - Ref: McpConfigJson

  McpTriggers:
    Type: ALIYUN::FC3::Trigger
    Count:
      Ref: McpConfigCount
    DependsOn: McpFunctions
    Properties:
      FunctionName:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Fn::GetAtt:
              - McpFunctions
              - FunctionName
      TriggerType: "http"
      TriggerName: "defaultTrigger"
      Qualifier: "LATEST"
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        disableURLInternet: false

  # 批量创建APIG服务
  McpApigServices:
    Type: ALIYUN::APIG::Service
    Count:
      Ref: McpConfigCount
    DependsOn: McpFunctions
    Properties:
      GatewayId:
        Ref: HigressAI
      SourceType: "FC3"
      ServiceName:
        Fn::Sub:
          - "${ServerCode}-${ALIYUN::StackName}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Qualifier: "LATEST"

  # 批量创建APIG路由
  McpApigRoutes:
    Type: ALIYUN::APIG::Route
    Count:
      Ref: McpConfigCount
    DependsOn:
      - McpApigServices
      - ApigGateway
      - McpHttpApi
    Properties:
      HttpApiId:
        Fn::GetAtt:
          - McpHttpApi
          - HttpApiId
      RouteName:
        Fn::Sub:
          - "${ServerCode}-route"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      DomainIds:
        - Ref: HigressDomainId
      EnvironmentInfo:
        EnvironmentId:
          Fn::Jq:
            - First
            - '.[0].EnvironmentId'
            - Fn::GetAtt:
                - ApigGateway
                - Environments
        GatewayInfo:
          GatewayId:
            Ref: HigressAI
      Match:
        Path:
          Type: "Prefix"
          Value:
            Fn::Sub:
              - "/mcp-servers/${ServerCode}"
              - ServerCode:
                  Fn::Select:
                    - Ref: ALIYUN::Index
                    - Ref: ServerCodeArray
        Methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
        IgnoreUriCase: false
      Backend:
        Scene: "SingleService"
        Services:
          - ServiceId:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Fn::GetAtt:
                    - McpApigServices
                    - ServiceId
            Name:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
            Port: 8080
            Protocol: "HTTP"
            Weight: 100
            Version: "LATEST"

Outputs:
  # MCP管控平台链接
  mcp_control_plane:
    Label:
      en: 'MCP Control Plane'
      zh-cn: MCP管控平台
    Value:
      Fn::Sub:
        - 'https://apig.console.aliyun.com/#/${RegionId}/ai-gateway/${GatewayId}/mcp-server?region=${RegionId}'
        - RegionId:
            Ref: ALIYUN::Region
          GatewayId:
            Ref: HigressAI

  mcp_config_count:
    Description:
      zh-cn: 创建的MCP服务数量
      en: Number of MCP services created
    Value:
      Ref: McpConfigCount

  deployment_time:
    Description:
      zh-cn: 部署完成时间
      en: Deployment completion time
    Value:
      Ref: CurTime

  # HTTP API相关输出
  http_api_id:
    Description:
      zh-cn: 创建的HTTP API ID
      en: Created HTTP API ID
    Value:
      Fn::GetAtt:
        - McpHttpApi
        - HttpApiId

  http_api_name:
    Description:
      zh-cn: 创建的HTTP API名称
      en: Created HTTP API name
    Value:
      Fn::GetAtt:
        - McpHttpApi
        - HttpApiName

  # OSS存储桶信息
  oss_bucket_name:
    Description:
      zh-cn: OSS存储桶名称
      en: OSS Bucket Name
    Value:
      Ref: OssBucketName

  # FC角色信息
  fc_role_arn:
    Description:
      zh-cn: FC函数角色ARN（所有函数使用）
      en: FC Function Role ARN (used by all functions)
    Value:
      Fn::GetAtt:
        - FcRole
        - Arn

  fc_role_name:
    Description:
      zh-cn: FC函数角色名称
      en: FC Function Role Name
    Value:
      Fn::GetAtt:
        - FcRole
        - RoleName

  function_ids:
    Description:
      zh-cn: 所有创建的函数ID列表
      en: List of all created function IDs
    Value:
      Fn::GetAtt:
        - McpFunctions
        - FunctionId

  function_names:
    Description:
      zh-cn: 所有创建的函数名称列表
      en: List of all created function names
    Value:
      Fn::GetAtt:
        - McpFunctions
        - FunctionName

  trigger_urls_internet:
    Description:
      zh-cn: 所有HTTP触发器的公网访问地址
      en: Internet access URLs for all HTTP triggers
    Value:
      Fn::GetAtt:
        - McpTriggers
        - UrlInternet

  route_ids:
    Description:
      zh-cn: 所有创建的路由ID列表
      en: List of all created route IDs
    Value:
      Fn::GetAtt:
        - McpApigRoutes
        - RouteId

  route_names:
    Description:
      zh-cn: 所有创建的路由名称列表
      en: List of all created route names
    Value:
      Fn::GetAtt:
        - McpApigRoutes
        - RouteName

  ai_gateway_summary:
    Description:
      zh-cn: AI网关部署摘要
      en: AI Gateway deployment summary
    Value:
      Fn::Sub:
        - "AI网关ID: ${GatewayId}, 域名ID: ${DomainId}, HTTP API: ${HttpApiId}, VPC: ${VpcId}, OSS: ${OssBucket}, FC角色: ${FcRole}, 创建了${Count}个MCP服务和路由"
        - GatewayId:
            Ref: HigressAI
          DomainId:
            Ref: HigressDomainId
          HttpApiId:
            Fn::GetAtt:
              - McpHttpApi
              - HttpApiId
          VpcId:
            Fn::GetAtt:
              - ApigGateway
              - Vpc
          OssBucket:
            Ref: OssBucketName
          FcRole:
            Fn::GetAtt:
              - FcRole
              - RoleName
          Count:
            Ref: McpConfigCount

Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - McpConfigJson
        Label:
          default:
            zh-cn: MCP服务配置
            en: MCP Service Configuration
      - Parameters:
          - HigressAI
          - HigressDomainId
        Label:
          default:
            zh-cn: AI网关配置
            en: AI Gateway Configuration
      - Parameters:
          - OssOption
          - BucketName
        Label:
          default:
            zh-cn: OSS存储配置
            en: OSS Storage Configuration
