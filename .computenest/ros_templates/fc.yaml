ROSTemplateFormatVersion: '2015-09-01'

Mappings:
  PaymentTypeMapping:
    PayTypeMap:
      PostPaid: PayAsYouGo
      PrePaid: Subscription

Conditions:
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption

  CreateGatewayConditions:
    Fn::Equals:
      - NewGateway
      - Ref: GatewayOption

  CreateVpcConditions:
    Fn::And:
      - Fn::Equals:
          - NewGateway
          - Ref: GatewayOption
      - Fn::Equals:
          - NewVPC
          - Ref: VpcOption

Locals:
  # 构建JSON事件字符串
  RegistrationEvent:
    Value:
      Fn::Sub:
        - |
          {
            "gateway_id": "${GatewayId}",
            "environment_id": "${EnvironmentId}",
            "domain_ids": ["${DomainId}"],
            "fc3_names": ${FunctionNames},
            "resource_group_id": "${ResourceGroupId}",
            "region": "${Region}",
            "enable_authentication": "${EnableAuth}",
            "descriptions": ${Descriptions}
          }
        - GatewayId:
            Ref: ActualGatewayId
          EnvironmentId:
            Fn::Jq:
              - First
              - '.[0].EnvironmentId'
              - Fn::GetAtt:
                  - ApigGateway
                  - Environments
          DomainId:
            Ref: HigressDomainId
          FunctionNames:
            Fn::Jq:
              - First
              - 'tostring'
              - Ref: FunctionNameArray
          ResourceGroupId:
            Fn::GetAtt:
              - ApigGateway
              - ResourceGroupId
          Region:
            Ref: ALIYUN::Region
          EnableAuth:
            Ref: EnableAuthentication
          Descriptions:
            Fn::Jq:
              - First
              - 'tostring'
              - Ref: DescriptionsMap
  FunctionNameArray:
    Value:
      Fn::Jq:
        - All
        - Fn::Sub:
            - '. | map( "${StackName}-" + .)'
            - StackName:
                Ref: ALIYUN::StackName
        - Ref: ServerCodeArray

  # 构建 descriptions 映射：{函数名: JSON字符串}，包含Name、Description、Icon
  DescriptionsMap:
    Value:
      Fn::Jq:
        - First
        - Fn::Sub:
            - '[.[] | {key: ("${StackName}-" + .serverCode), value: ({Name: (.serviceName // .serverCode), Description: ((.description // .serviceName // .serverCode) | .[:60]), Icon: (.icon // null)} | with_entries(select(.value != null)) | tojson)}] | from_entries'
            - StackName:
                Ref: ALIYUN::StackName
        - Ref: McpConfigJson

  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai
  CurTimeNumber:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d%H%M%S'
        - Asia/Shanghai

  # 计算MCP配置数量
  McpConfigCount:
    Value:
      Fn::Length:
        Ref: McpConfigJson

  # 提取serverCode数组
  ServerCodeArray:
    Value:
      Fn::Jq:
        - All
        - ".[] | .serverCode"
        - Ref: McpConfigJson

  # 构建配置类型数组
  ConfigTypeArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then "sse" 
          elif .command == "npx" and (.pkgType == "private") then "npx-private" 
          elif .command == "npx" then "npx-public" 
          elif .command == "uvx" and (.pkgType == "private") then "uvx-private" 
          elif .command == "uvx" then "uvx-public" 
          else "sse" 
          end
        - Ref: McpConfigJson

  # 构建Layers数组
  LayersArray:
    Value:
      Fn::Jq:
        - All
        - Fn::Sub:
            - |
              .[] | [
                if .command == "npx" then 
                  "acs:fc:${Region}:official:layers/Nodejs-MCP/versions/2"
                elif .command == "uvx" and (.pkgType == "private") then 
                  "acs:fc:${Region}:official:layers/Python312/versions/1"
                else 
                  "acs:fc:${Region}:official:layers/Python3x-MCP/versions/4"
                end, 
                "acs:fc:${Region}:1730431480417716:layers/MCP-Runtime-V2/versions/1"
              ]
            - Region:
                Ref: ALIYUN::Region
        - Ref: McpConfigJson

  CommandArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx " + (.args | map(if startswith("/mcp-package/") then "/home/app/" + (. | ltrimstr("/mcp-package/") | rtrimstr(".zip")) else . end) | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx -y " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | map(if startswith("/mcp-package/") then "/home/app/" + (. | ltrimstr("/mcp-package/") | rtrimstr(".zip")) else . end) | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          else 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          end
        - Ref: McpConfigJson




  OssObjectNameArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
            (.packageOssPath | ltrimstr("/") | rtrimstr(".zip"))  # 去除.zip后缀
          else 
            "flask-web-code.zip" 
          end
        - Ref: McpConfigJson


  # 获取OSS桶名（用于后续替换）
  OssBucketName:
    Value:
      Fn::If:
        - CreateOssConditions
        - Fn::GetAtt:
            - OSSBucket
            - Name
        - Ref: BucketName

  # 获取实际使用的网关ID
  ActualGatewayId:
    Value:
      Fn::If:
        - CreateGatewayConditions
        - Fn::GetAtt:
            - NewApigGateway
            - GatewayId
        - Ref: HigressAI

  # 映射网关付费类型
  GatewayPaymentType:
    Value:
      Fn::FindInMap:
        - PaymentTypeMapping
        - PayTypeMap
        - Ref: PayType

  # 获取实际使用的VPC ID
  ActualVpcId:
    Value:
      Fn::If:
        - CreateVpcConditions
        - Ref: EcsVpc
        - Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc

  # 获取实际使用的VSwitch ID
  ActualVSwitchId:
    Value:
      Fn::If:
        - CreateVpcConditions
        - Ref: PrimaryEcsVSwitch
        - Fn::GetJsonValue:
            - VSwitchId
            - Fn::GetAtt:
                - ApigGateway
                - VSwitch

Parameters:
  EnableAuthentication:
    Type: Boolean
    Label:
      en: Enable Authentication
      zh-cn: 启用认证
    Description:
      zh-cn: <font color='green'>为MCP服务启用Apikey认证，提高安全性。注意：使用时需要通过消费者凭证访问</font>
      en: <font color='green'>Enable Apikey authentication for MCP services to enhance security</font>
    Default: false
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: 'ALIYUN::MCP::Server::Server'
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCounts: 9
      ShowTagsCounts: 10
    Default: '[{"serviceName":"Fetch网页内容抓取","serverCode":"fetch","env":{},"command":"uvx","args":["mcp-server-fetch"]}]'

  GatewayOption:
    Type: String
    AllowedValues:
      - ExistingGateway
      - NewGateway
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingGateway:
          zh-cn: 使用已有AI网关
          en: Use Existing AI Gateway
        NewGateway:
          zh-cn: 新建AI网关
          en: Create New AI Gateway
    Label:
      en: AI Gateway Option
      zh-cn: AI网关选项
    Description:
      zh-cn: <font color='green'>统一的MCP流量，鉴权入口<br>AI网关作为MCP服务的统一接入点，提供流量管理和身份验证功能</font>
      en: <font color='green'>Unified MCP traffic and authentication entry<br>AI Gateway serves as a unified access point for MCP services, providing traffic management and authentication functions</font>
    Required: true
    Default: ExistingGateway

  HigressAI:
    Type: String
    Required:
      Fn::Equals:
        - ExistingGateway
        - ${GatewayOption}
    AssociationProperty: ALIYUN::APIG::Gateway::GatewayId
    AssociationPropertyMetadata:
      GatewayType: AI
      RegionId:
        Ref: ALIYUN::Region
      Visible:
        Condition:
          Fn::Equals:
            - ExistingGateway
            - ${GatewayOption}
    Default: ""
    Label:
      zh-cn: 已有AI网关
      en: Existing AI Gateway
    Description:
      zh-cn: 选择已有的AI网关实例ID
      en: Select existing AI Gateway instance ID

  HigressDomainId:
    Type: String
    Required: true
    AssociationProperty: ALIYUN::APIG::Gateway::ListDomains
    AssociationPropertyMetadata:
      GatewayType: AI
    Label:
      zh-cn: AI域名
      en: AI DomainId
    Description:
      zh-cn: AI网关域名ID，用于路由配置
      en: AI Gateway domain ID for route configuration

  GatewaySpec:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    Default: "aigw.small.x1"
    AllowedValues:
      - "aigw.small.x1"
      - "aigw.medium.x1"
      - "aigw.large.x1"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}
    Label:
      zh-cn: 网关规格
      en: Gateway Specification
    Description:
      zh-cn: AI网关实例规格
      en: AI Gateway instance specification

  # 统一付费类型参数 - 只在新建网关时显示
  PayType:
    Type: String
    Label:
      en: Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}

  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Not:
                Fn::Equals:
                  - ${PayType}
                  - PostPaid

  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Not:
                Fn::Equals:
                  - ${PayType}
                  - PostPaid

  PrimaryZoneId:
    Type: String
    Label:
