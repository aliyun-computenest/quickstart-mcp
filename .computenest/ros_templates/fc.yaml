  VpcOption:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    AllowedValues:
      - ExistingVPC
      - NewVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingVPC:
          zh-cn: 使用已有VPC
          en: Use Existing VPC
        NewVPC:
          zh-cn: 新建VPC
          en: Create New VPC
      Visible:
        Condition:
          Fn::Or:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Equals:
                - true
                - ${EnableHiMarket}
    Label:
      en: VPC Option
      zh-cn: VPC选项
    Default: NewVPC

  VpcId:
    Type: String
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::ECS::VPC::VPCId
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Label:
      zh-cn: VPC ID
      en: VPC ID
    Description:
      zh-cn: 选择已有的VPC
      en: Select existing VPC

  PrimaryVSwitchId:
    Type: String
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::VSwitchId
    Default: ''
    AssociationPropertyMetadata:
      VpcId: ${VpcId}
      ZoneId: ${PrimaryZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    Label:
      zh-cn: 主交换机ID
      en: Primary VSwitch ID
    Description:
      zh-cn: 选择主可用区的交换机
      en: Select VSwitch in primary zone

  VpcCidrBlock:
    Type: String
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    Default: "192.168.0.0/16"
    AllowedValues:
      - "192.168.0.0/16"
      - "172.16.0.0/12"
      - "10.0.0.0/8"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Label:
      zh-cn: VPC网段
      en: VPC CIDR Block
    Description:
      zh-cn: 新建VPC的网段
      en: CIDR block for new VPC

  PrimaryVSwitchCidrBlock:
    Type: String
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    Default: "192.168.1.0/24"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Label:
      zh-cn: 主交换机网段
      en: Primary VSwitch CIDR Block
    Description:
      zh-cn: 新建主交换机的网段
      en: CIDR block for new primary VSwitch

  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Description:
      zh-cn: <font color='green'>用于存储企业内部MCP Package。<br>如使用已有的OSS，请在部署后参考服务实例文档为相关账号授予权限。</font>
      en: <font color='green'>Used to store enterprise internal MCP Packages.<br>If using an existing OSS, please refer to the service instance documentation after deployment.</font>
    Required: true
    Default: NewOSS

  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}

  # ECS相关参数 - 只在启用HiMarket时显示
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
      Visible:
        Condition:
          Fn::Equals:
            - true
            - ${EnableHiMarket}
    AllowedValues:
      - ecs.u1-c1m4.large
      - ecs.u1-c1m1.xlarge
      - ecs.u1-c1m2.xlarge
      - ecs.u1-c1m4.xlarge
      - ecs.u1-c1m1.2xlarge
      - ecs.u1-c1m2.3xlarge
      - ecs.u1-c1m1.4xlarge
      - ecs.e-c1m2.xlarge
      - ecs.e-c1m4.large
      - ecs.u1-c1m2.large
    Default: ecs.u1-c1m1.xlarge

  InternetMaxBandwidthOut:
    Type: Number
    Label:
      zh-cn: 公网带宽 (Mbps)
      en: Internet Max Bandwidth Out (Mbps)
    MinValue: 1
    MaxValue: 100
    Default: 8
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - true
            - ${EnableHiMarket}

  InternetChargeType:
    Type: String
    Label:
      zh-cn: 带宽付费类型
      en: Internet Charge Type
    AssociationPropertyMetadata:
      ValueLabelMapping:
        PayByTraffic: 按流量计费
        PayByBandwidth: 按固定带宽计费
      Visible:
        Condition:
          Fn::Equals:
            - true
            - ${EnableHiMarket}
    AllowedValues:
      - PayByBandwidth
      - PayByTraffic
    Default: PayByTraffic

Resources:
  RandomPassword:
    Type: ALIYUN::RandomString
    Condition: CreateHiMarketConditions
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="

  # 新建VPC（当选择新建网关且新建VPC时）
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Fn::Sub: "${ALIYUN::StackName}-vpc"
      CidrBlock:
        Ref: VpcCidrBlock

  # 新建主VSwitch（当选择新建网关且新建VPC时）
  PrimaryEcsVSwitch:
    Type: ALIYUN::ECS::VSwitch
    Condition: CreateVpcConditions
    Properties:
      VSwitchName:
        Fn::Sub: "${ALIYUN::StackName}-primary-vswitch"
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: PrimaryZoneId
      CidrBlock:
        Ref: PrimaryVSwitchCidrBlock

  # 新建AI网关
  NewApigGateway:
    Type: ALIYUN::APIG::Gateway
    Condition: CreateGatewayConditions
    Properties:
      GatewayName:
        Ref: ALIYUN::StackName
      GatewayType: "AI"
      PaymentType:
        Ref: GatewayPaymentType
      Period:
        Ref: PayPeriod
      PeriodUnit:
        Ref: PayPeriodUnit
      Spec:
        Ref: GatewaySpec
      ZoneConfig:
        SelectOption: "Auto"
      NetworkAccessConfig:
        Type: "InternetAndIntranet"
      Vpc:
        VpcId:
          Fn::If:
            - CreateVpcConditions
            - Ref: EcsVpc
            - Ref: VpcId
      VSwitch:
        VSwitchId:
          Fn::If:
            - CreateVpcConditions
            - Ref: PrimaryEcsVSwitch
            - Ref: PrimaryVSwitchId

  # 查询网关详情，获取VPC、VSwitch、SecurityGroup等信息
  ApigGateway:
    Type: DATASOURCE::APIG::Gateway
    Properties:
      GatewayId:
        Ref: ActualGatewayId

  ExistVsw:
    Type: DATASOURCE::VPC::VSwitch
    Properties:
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ApigGateway
              - VSwitch

  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ApigGateway
              - Vpc
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 3000/3000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  # HiMarket安全组
  HiMarketSecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Condition: CreateHiMarketConditions
    Properties:
      SecurityGroupName:
        Fn::Sub: "${ALIYUN::StackName}-himarket"
      VpcId:
        Ref: ActualVpcId
      SecurityGroupIngress:
        - PortRange: 5174/5174
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 80/80
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  # 创建OSS存储桶
  OSSBucket:
    Type: ALIYUN::OSS::Bucket
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      BucketName:
        Fn::Sub: "mcp-${ALIYUN::StackName}"
      Policy:
        Version: "1"
        Statement:
          - Effect: "Allow"
            Action:
              - "oss:GetObject"
              - "oss:PutObject"
              - "oss:GetObjectAcl"
              - "oss:PutObjectAcl"
              - "oss:AbortMultipartUpload"
              - "oss:ListParts"
              - "oss:RestoreObject"
              - "oss:GetVodPlaylist"
              - "oss:PostVodPlaylist"
              - "oss:PublishRtmpStream"
              - "oss:ListObjectVersions"
              - "oss:GetObjectVersion"
              - "oss:GetObjectVersionAcl"
              - "oss:RestoreObjectVersion"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}/*"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
          - Effect: "Allow"
            Action:
              - "oss:ListObjects"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
            Condition:
              StringLike:
                "oss:Prefix":
                  - "*"

  # 创建FC角色（所有函数都使用此角色）
  FcRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: "McpFcRole-${ALIYUN::StackName}"
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - fc.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Fn::Sub: "McpFcPolicy-${ALIYUN::StackName}"
          PolicyDocument:
            Statement:
              - Action:
                  - oss:GetObject
                  - oss:PutObject
                  - oss:ListObjects
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - "acs:oss:*:*:fc-layers-cn-hangzhou"
                  - "acs:oss:*:*:fc-layers-cn-hangzhou/*"
              - Action:
                  - vpc:DescribeVpcs
                  - vpc:DescribeVSwitches
                  - ecs:DescribeSecurityGroups
                  - vpc:DescribeVSwitchAttributes
                Effect: Allow
                Resource:
                  - "*"
              - Action:
                  - apig:*
                Effect: Allow
                Resource:
                  - "*"
            Version: '1'

  McpFunctions:
    Type: ALIYUN::FC3::Function
    Count:
      Ref: McpConfigCount
    DependsOn:
      - ApigGateway
      - FcRole
    Properties:
      FunctionName:
        Fn::Sub:
          - "${ALIYUN::StackName}-${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Handler: "index.handler"
      Runtime: "custom.debian12"
      MemorySize: 1024
      DiskSize: 512
      Timeout: 60
      InstanceConcurrency: 20
      InternetAccess: true
      Cpu: 1
      # 角色：所有函数都使用创建的角色
      SessionAffinity: MCP_SSE
      SessionAffinityConfig:
        SseEndpointPath: /sse
        SessionConcurrencyPerInstance: 20
      Role:
        Fn::GetAtt:
          - FcRole
          - Arn
      Layers:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Ref: LayersArray
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Code:
        # OSS桶名：私有包使用创建的OSS，公开包使用默认OSS
        OssBucketName:
          Fn::Jq:
            - First
            - Fn::Sub:
                - |
                  if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
                    "${BucketName}" 
                  else 
                    "fc-layers-cn-hangzhou" 
                  end
                - BucketName:
                    Ref: OssBucketName
            - Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: McpConfigJson
        # OSS对象名：使用预构建的对象名数组
        OssObjectName:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: OssObjectNameArray
      # OSS挂载配置：所有函数都挂载OSS到统一路径
      OssMountConfig:
        MountPoints:
          - BucketName:
              Ref: OssBucketName
            BucketPath: "/mcp-package"
            ReadOnly: true
            MountDir: "/home/app"
            Endpoint:
              Fn::Sub:
                - "https://oss-${region}.aliyuncs.com"
                - region:
                    Ref: ALIYUN::Region

      CustomRuntimeConfig:
        Port: 8080
        Command:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: CommandArray
      # VPC配置 - 直接使用网关的VPC信息
      VpcConfig:
        VpcId:
          Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc
        VSwitchIds:
          Fn::ListMerge:
            - - Fn::GetJsonValue:
                  - VSwitchId
                  - Fn::GetAtt:
                      - ApigGateway
                      - VSwitch
        SecurityGroupId:
          Ref: SecurityGroup
      # 环境变量配置
      EnvironmentVariables:
        Fn::Jq:
          - First
          - Fn::Sub:
              - |
                . as $config | {
                  "LD_LIBRARY_PATH": "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib",
                  "PATH": (
                    if $config.command == "npx" then 
                      "/var/fc/lang/nodejs22/bin:/var/fc/lang/python3.13/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    else 
                      "/var/fc/lang/python3.13/bin:/var/fc/lang/nodejs22/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    end
                  ),
                  "PYTHONPATH": "/opt/python:/code",
                  "NODE_PATH": (
                    if $config.command == "npx" then 
                      "/opt/nodejs/node_modules" 
                    else 
                      null 
                    end
                  ),
                  "DEPLOY_TIME": "${DeployTime}",
                  "SERVER_CODE": $config.serverCode,
                  "CONFIG_TYPE": (
                    if $config.command == null then "sse" 
                    elif $config.command == "npx" and ($config.pkgType == "private") then "npx-private" 
                    elif $config.command == "npx" then "npx-public" 
                    elif $config.command == "uvx" and ($config.pkgType == "private") then "uvx-private" 
                    elif $config.command == "uvx" then "uvx-public" 
                    else "sse" 
                    end
                  )
                } + ($config.env // {})
              - DeployTime:
                  Ref: CurTime
          - Fn::Select:
              - Ref: ALIYUN::Index
              - Ref: McpConfigJson

  McpTriggers:
    Type: ALIYUN::FC3::Trigger
    Count:
      Ref: McpConfigCount
    DependsOn: McpFunctions
    Properties:
      FunctionName:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Fn::GetAtt:
              - McpFunctions
              - FunctionName
      TriggerType: "http"
      TriggerName: "defaultTrigger"
      Qualifier: "LATEST"
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        disableURLInternet: false

  # MCP注册函数
  McpRegistrationFunction:
    Type: ALIYUN::FC3::Function
    DependsOn:
      - ApigGateway
      - FcRole
      - OSSBucket
      - McpTriggers
    Properties:
      FunctionName:
        Fn::Sub: "mcp-registration-${ALIYUN::StackName}"
      Handler: "fc-mcp.handler"
      Runtime: "python3.12"
      MemorySize: 512
      DiskSize: 512
      Timeout: 300  # 5分钟超时，足够处理批量注册
      InstanceConcurrency: 1
      InternetAccess: true
      Cpu: 0.5
      Role:
        Fn::GetAtt:
          - FcRole
          - Arn
      Layers:
        - "acs:fc:cn-hangzhou:1563457855438522:layers/alibabacloud_apig20240327/versions/9"
      Description: "apig registration"
      Code:
        # 使用创建的OSS桶
        OssBucketName: service-info-public
        OssObjectName: "mcp/fc-mcp.py.zip"  # 需要先上传oss.py到OSS
      # VPC配置 - 使用网关的VPC信息
      VpcConfig:
        VpcId:
          Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc
        VSwitchIds:
          Fn::ListMerge:
            - - Fn::GetJsonValue:
                  - VSwitchId
                  - Fn::GetAtt:
                      - ApigGateway
                      - VSwitch
        SecurityGroupId:
          Ref: SecurityGroup
      # 环境变量
      EnvironmentVariables:
        PYTHONPATH: "/opt/python:/code"
        LD_LIBRARY_PATH: "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib"

  McpRegistrationTrigger:
    Type: ALIYUN::FC3::Trigger
    DependsOn: McpRegistrationFunction
    Properties:
      FunctionName:
        Fn::GetAtt:
          - McpRegistrationFunction
          - FunctionName
      TriggerType: "http"
      TriggerName: "registrationTrigger"
      Qualifier: "LATEST"
      Description: "mcp"
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
        disableURLInternet: false

  # MCP服务注册调用器
  McpRegistrationInvoker:
    Type: ALIYUN::FC3::FunctionInvoker
    DependsOn:
      - McpRegistrationFunction
      - McpFunctions
    Properties:
      FunctionName:
        Fn::GetAtt:
          - McpRegistrationFunction
          - FunctionName
      Async: false
      CheckError: true
      ExecuteVersion:
        Ref: CurTimeNumber
      Event:
        Ref: RegistrationEvent
      Qualifier: "LATEST"

  # HiMarket实例组
  HiMarketInstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Condition: CreateHiMarketConditions
    Properties:
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Ref: ActualVpcId
      VSwitchId:
        Ref: ActualVSwitchId
      ZoneId:
        Fn::If:
          - CreateVpcConditions
          - Ref: PrimaryZoneId
          - Fn::GetAtt:
              - ExistVsw
              - ZoneId
      SecurityGroupId:
        Ref: HiMarketSecurityGroup
      ImageId: ecs_image_himarket
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize: 40
      InternetMaxBandwidthOut:
        Ref: InternetMaxBandwidthOut
      InternetChargeType:
        Ref: InternetChargeType
      IoOptimized: optimized
      MaxAmount: 1
      DiskMappings:
        - Category: cloud_essd
          Size: 200
      # 数据盘初始化和挂载
      UserData: |
        #cloud-config
        bootcmd:
          - |
            #!/bin/bash
            function init_and_mount_data_disk() {
                disk_device="/dev/vdb"
                parted_disk_device="/dev/vdb1"
                mount_point="/data"
                # 已初始化的磁盘，跳过初始化，直接挂载
                if blkid -o value -s TYPE $disk_device &>/dev/null; then
                  echo "Disk is already initialized."
                else
                  echo "Disk is not initialized, initializing..."
                  cat >> /root/InitDataDisk.sh << "EOF"
            #!/bin/bash
            echo "p
            n
            p



            w
            " |  fdisk -u /dev/vdb
            EOF
                  /bin/bash /root/InitDataDisk.sh
                  rm -f /root/InitDataDisk.sh
                  mkfs -t ext4 $parted_disk_device
                fi

                cp /etc/fstab /etc/fstab.bak
                mkdir $mount_point
                echo `blkid $parted_disk_device | awk '{print $2}' | sed 's/\\\"//g'` $mount_point ext4 defaults 0 0 >> /etc/fstab
                mount -a
            }
            init_and_mount_data_disk

  # HiMarket安装命令
  HiMarketRunInstallCommand:
    Type: ALIYUN::ECS::RunCommand
    Condition: CreateHiMarketConditions
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - HiMarketInstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            # 创建开机自启动配置和状态检查脚本
            function create_systemd_config() {
                file_path="/etc/systemd/system/himarket.service"
                if [ -f "$file_path" ]; then
                    echo "Systemd配置已存在: $file_path"
                    return 1
                fi
                cat > $file_path <<EOF
            [Unit]
            Description=Docker Compose Application Service
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            WorkingDirectory=/root/application
            ExecStart=/bin/bash -c '/usr/bin/docker compose -f docker-compose.yaml up -d && /usr/local/bin/check-container-status'
            ExecStop=/usr/bin/docker compose down
            TimeoutStartSec=0

            [Install]
            WantedBy=multi-user.target
            EOF

                # 创建状态检查脚本
                cat > /usr/local/bin/check-container-status <<'EOF'
            #!/bin/bash
            COMPOSE_FILE="docker-compose.yaml"
            MAX_WAIT_TIME=3600
            CHECK_INTERVAL=10

            if ! command -v docker compose &> /dev/null; then
                echo "Error: docker compose is not installed"
                exit 1
            fi

            SERVICES=$(docker compose -f "$COMPOSE_FILE" config --services 2>/dev/null)
            if [ -z "$SERVICES" ]; then
                echo "Error: No services found"
                exit 1
            fi

            WAIT_TIME=0
            TIMEOUT_REACHED=false

            while [ $WAIT_TIME -le $MAX_WAIT_TIME ]; do
                ALL_HEALTHY=true
                for SERVICE in $SERVICES; do
                    CONTAINER_ID=$(docker compose -f "$COMPOSE_FILE" ps -q "$SERVICE")

                    if [ -z "$CONTAINER_ID" ]; then
                        echo "[$SERVICE] Not running"
                        ALL_HEALTHY=false
                        continue
                    fi

                    INSPECT_OUTPUT=$(docker inspect --format \
                        '{{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                        "$CONTAINER_ID" 2>/dev/null)

                    STATUS=$(echo "$INSPECT_OUTPUT" | awk '{print $1}')
                    HEALTH_STATUS=$(echo "$INSPECT_OUTPUT" | awk '{print $2}')

                    case "$HEALTH_STATUS" in
                        "healthy") ;;
                        "unhealthy"|"starting")
                            echo "[$SERVICE] Unhealthy: $HEALTH_STATUS"
                            ALL_HEALTHY=false
                            ;;
                        "no-healthcheck")
                            [ "$STATUS" != "running" ] && ALL_HEALTHY=false
                            ;;
                        *)
                            echo "[$SERVICE] Unknown status: $HEALTH_STATUS"
                            ALL_HEALTHY=false
                            ;;
                    esac
                done

                $ALL_HEALTHY && exit 0
                [ $WAIT_TIME -ge $MAX_WAIT_TIME ] && break

                sleep $CHECK_INTERVAL
                WAIT_TIME=$((WAIT_TIME + CHECK_INTERVAL))
            done

            echo "Timeout reached! Abnormal services:" >&2
            docker compose -f "$COMPOSE_FILE" ps --all
            exit 1
            EOF

                chmod +x /usr/local/bin/check-container-status
                systemctl enable himarket
            
            }

            function create_custom_parameter_file() {
                echo "The custom parameter does not exist. Skip the processing"
            }

            function mount_data_disk_dir() {
                # 先计算出docker-compose.yaml的父目录
                docker_compose_parent_dir=$(dirname "/root/application/docker-compose.yaml")
                # 复制软件目录下目录和文件到数据盘挂载目录，加-n参数已存在则不进行复制
                cp -rn $docker_compose_parent_dir/* /data
                # sed替换挂载目录路径为数据盘目录
                cp $docker_compose_parent_dir/docker-compose.yaml $docker_compose_parent_dir/docker-compose.yaml.bak
                sed -i 's|\./|/data/|g' $docker_compose_parent_dir/docker-compose.yaml
                chmod -R 777 /data
            }

            #用于版本升级
            echo "当前时间：${CurTime}"
            create_systemd_config
            systemctl daemon-reload
            systemctl stop himarket
            create_custom_parameter_file
            mount_data_disk_dir
            systemctl start himarket
          - RegionId:
              Ref: ALIYUN::Region
            CurTime:
              Ref: CurTime

Outputs:
  # MCP管控平台链接
  mcp_control_plane:
    Label:
      en: 'MCP Control Plane'
      zh-cn: MCP管控平台
    Value:
      Fn::Sub:
        - 'https://apig.console.aliyun.com/#/${RegionId}/ai-gateway/${GatewayId}/mcp-server?region=${RegionId}'
        - RegionId:
            Ref: ALIYUN::Region
          GatewayId:
            Ref: ActualGatewayId

  # HiMarket相关输出
  himarket_admin_address:
    Condition: CreateHiMarketConditions
    Label:
      en: 'HiMarket Admin Portal'
      zh-cn: HiMarket管理员页面
