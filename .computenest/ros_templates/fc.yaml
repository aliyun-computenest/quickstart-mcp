          - GatewaySpec
        Label:
          default:
            zh-cn: AI网关配置
            en: AI Gateway Configuration
      - Parameters:
          - PayType
          - PayPeriodUnit
          - PayPeriod
        Label:
          default: 付费类型配置
      - Parameters:
          - PrimaryZoneId
          - VpcOption
          - VpcId
          - PrimaryVSwitchId
          - VpcCidrBlock
          - PrimaryVSwitchCidrBlock
        Label:
          default:
            zh-cn: 网络配置
            en: Network Configuration
      - Parameters:
          - OssOption
          - BucketName
        Label:
