ROSTemplateFormatVersion: '2015-09-01'

Conditions:
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption

  CreateGatewayConditions:
    Fn::Equals:
      - NewGateway
      - Ref: GatewayOption

  CreateVpcConditions:
    Fn::And:
      - Fn::Equals:
          - NewGateway
          - Ref: GatewayOption
      - Fn::Equals:
          - NewVPC
          - Ref: VpcOption

Locals:
  # 构建JSON事件字符串
  RegistrationEvent:
    Value:
      Fn::Sub:
        - |
          {
            "gateway_id": "${GatewayId}",
            "environment_id": "${EnvironmentId}",
            "domain_ids": ["${DomainId}"],
            "fc3_names": ${FunctionNames},
            "resource_group_id": "${ResourceGroupId}",
            "region": "${Region}"
          }
        - GatewayId:
            Ref: ActualGatewayId
          EnvironmentId:
            Fn::Jq:
              - First
              - '.[0].EnvironmentId'
              - Fn::GetAtt:
                  - ApigGateway
                  - Environments
          DomainId:
            Ref: HigressDomainId
          FunctionNames:
            Fn::Jq:
              - First
              - 'tostring'
              - Ref: FunctionNameArray
          ResourceGroupId:
            Fn::GetAtt:
              - ApigGateway
              - ResourceGroupId
          Region:
            Ref: ALIYUN::Region
  FunctionNameArray:
    Value:
      Fn::Jq:
        - All
        - Fn::Sub:
            - '. | map( "${StackName}-" + .)'
            - StackName:
                Ref: ALIYUN::StackName
        - Ref: ServerCodeArray

  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai

  # 计算MCP配置数量
  McpConfigCount:
    Value:
      Fn::Length:
        Ref: McpConfigJson

  # 提取serverCode数组
  ServerCodeArray:
    Value:
      Fn::Jq:
        - All
        - ".[] | .serverCode"
        - Ref: McpConfigJson

  # 构建配置类型数组
  ConfigTypeArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then "sse" 
          elif .command == "npx" and (.pkgType == "private") then "npx-private" 
          elif .command == "npx" then "npx-public" 
          elif .command == "uvx" and (.pkgType == "private") then "uvx-private" 
          elif .command == "uvx" then "uvx-public" 
          else "sse" 
          end
        - Ref: McpConfigJson

  # 构建Layers数组
  LayersArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | [
            if .command == "npx" then 
              "acs:fc:cn-hangzhou:official:layers/Nodejs-MCP/versions/2"
            elif .command == "uvx" and (.pkgType == "private") then 
              "acs:fc:cn-hangzhou:official:layers/Python312/versions/1"
            else 
              "acs:fc:cn-hangzhou:official:layers/Python3x-MCP/versions/4"
            end, 
            "acs:fc:cn-hangzhou:1730431480417716:layers/MCP-Runtime-V2/versions/1"
          ]
        - Ref: McpConfigJson

  # 构建Command数组
  CommandArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if .command == null then 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "npx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"npx -y " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" and (.pkgType == "private") then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          elif .command == "uvx" then 
            [
              "supergateway", 
              "--stdio", 
              ("\"uvx " + (.args | join(" ")) + "\""), 
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          else 
            [
              "supergateway", 
              "--sse", 
              .url,
              "--port", "8080", 
              "--ssePath", "/sse", 
              "--messagePath", "/message"
            ]
          end
        - Ref: McpConfigJson

  # 构建OSS对象名数组
  OssObjectNameArray:
    Value:
      Fn::Jq:
        - All
        - |
          .[] | 
          if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
            (.packageOssPath | ltrimstr("/")) 
          else 
            "flask-web-code.zip" 
          end
        - Ref: McpConfigJson

  # 获取OSS桶名（用于后续替换）
  OssBucketName:
    Value:
      Fn::If:
        - CreateOssConditions
        - Fn::GetAtt:
            - OSSBucket
            - Name
        - Ref: BucketName

  # 获取实际使用的网关ID
  ActualGatewayId:
    Value:
      Fn::If:
        - CreateGatewayConditions
        - Fn::GetAtt:
            - NewApigGateway
            - GatewayId
        - Ref: HigressAI

Parameters:
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: 'ALIYUN::MCP::Server::Server'
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCounts: 9
      ShowTagsCounts: 10
    Default: '[{"serviceName":"Fetch网页内容抓取","serverCode":"fetch","env":{},"command":"uvx","args":["mcp-server-fetch"]}]'


  GatewayOption:
    Type: String
    AllowedValues:
      - ExistingGateway
      - NewGateway
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingGateway:
          zh-cn: 使用已有AI网关
          en: Use Existing AI Gateway
        NewGateway:
          zh-cn: 新建AI网关
          en: Create New AI Gateway
    Label:
      en: AI Gateway Option
      zh-cn: AI网关选项
    Required: true
    Default: ExistingGateway

  HigressAI:
    Type: String
    Required:
      Fn::Equals:
        - ExistingGateway
        - ${GatewayOption}
    AssociationProperty: ALIYUN::APIG::Gateway::GatewayId
    AssociationPropertyMetadata:
      GatewayType: AI
      RegionId:
        Ref: ALIYUN::Region
      Visible:
        Condition:
          Fn::Equals:
            - ExistingGateway
            - ${GatewayOption}
    Default: ""
    Label:
      zh-cn: 已有AI网关
      en: Existing AI Gateway
    Description:
      zh-cn: 选择已有的AI网关实例ID
      en: Select existing AI Gateway instance ID

  HigressDomainId:
    Type: String
    Required:
      Fn::Equals:
        - ExistingGateway
        - ${GatewayOption}
    AssociationProperty: ALIYUN::APIG::Gateway::ListDomains
    AssociationPropertyMetadata:
      GatewayType: AI
    Label:
      zh-cn: AI域名
      en: AI DomainId
    Description:
      zh-cn: AI网关域名ID，用于路由配置
      en: AI Gateway domain ID for route configuration

  GatewaySpec:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    Default: "aigw.small.x1"
    AllowedValues:
      - "aigw.small.x1"
      - "aigw.medium.x1"
      - "aigw.large.x1"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}
    Label:
      zh-cn: 网关规格
      en: Gateway Specification
    Description:
      zh-cn: AI网关实例规格
      en: AI Gateway instance specification

  # 网关付费类型
  PayType:
    Type: String
    Label:
      en: Gateway Charge Type
      zh-cn: 网关付费类型
    Default: PayAsYouGo
    AllowedValues:
      - PayAsYouGo
      - Subscription
    AssociationPropertyMetadata:
      ValueLabelMapping:
        PayAsYouGo:
          zh-cn: 按量付费
          en: Pay as you go
        Subscription:
          zh-cn: 包年包月
          en: subscription
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}

  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Not:
                Fn::Equals:
                  - ${PayType}
                  - PayAsYouGo

  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Not:
                Fn::Equals:
                  - ${PayType}
                  - PayAsYouGo

  # 主可用区ID
  PrimaryZoneId:
    Type: String
    Label:
      en: Primary Zone ID
      zh-cn: 主可用区ID
    Description:
      zh-cn: AI网关主可用区，用于创建主交换机
      en: Primary zone for AI Gateway, used to create primary VSwitch
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    AssociationPropertyMetadata:
      DefaultValueStrategy: random
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    Default: ""

  VpcOption:
    Type: String
    Required:
      Fn::Equals:
        - NewGateway
        - ${GatewayOption}
    AllowedValues:
      - ExistingVPC
      - NewVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        ExistingVPC:
          zh-cn: 使用已有VPC
          en: Use Existing VPC
        NewVPC:
          zh-cn: 新建VPC
          en: Create New VPC
      Visible:
        Condition:
          Fn::Equals:
            - NewGateway
            - ${GatewayOption}
    Label:
      en: VPC Option
      zh-cn: VPC选项
    Default: NewVPC

  VpcId:
    Type: String
    Required:
      Fn::And:
        - Fn::Equals:
            - NewGateway
            - ${GatewayOption}
        - Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    AssociationProperty: ALIYUN::ECS::VPC::VPCId
    Default: ''
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Equals:
                - ExistingVPC
                - ${VpcOption}
    Label:
      zh-cn: VPC ID
      en: VPC ID
    Description:
      zh-cn: 选择已有的VPC
      en: Select existing VPC


  PrimaryVSwitchId:
    Type: String
    Required:
      Fn::And:
        - Fn::Equals:
            - NewGateway
            - ${GatewayOption}
        - Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::VSwitchId
    Default: ''
    AssociationPropertyMetadata:
      VpcId: ${VpcId}
      ZoneId: ${PrimaryZoneId}
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Equals:
                - ExistingVPC
                - ${VpcOption}
    Label:
      zh-cn: 主交换机ID
      en: Primary VSwitch ID
    Description:
      zh-cn: 选择主可用区的交换机
      en: Select VSwitch in primary zone


  VpcCidrBlock:
    Type: String
    Required:
      Fn::And:
        - Fn::Equals:
            - NewGateway
            - ${GatewayOption}
        - Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Default: "192.168.0.0/16"
    AllowedValues:
      - "192.168.0.0/16"
      - "172.16.0.0/12"
      - "10.0.0.0/8"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Equals:
                - NewVPC
                - ${VpcOption}
    Label:
      zh-cn: VPC网段
      en: VPC CIDR Block
    Description:
      zh-cn: 新建VPC的网段
      en: CIDR block for new VPC

  PrimaryVSwitchCidrBlock:
    Type: String
    Required:
      Fn::And:
        - Fn::Equals:
            - NewGateway
            - ${GatewayOption}
        - Fn::Equals:
            - NewVPC
            - ${VpcOption}
    Default: "192.168.1.0/24"
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - NewGateway
                - ${GatewayOption}
            - Fn::Equals:
                - NewVPC
                - ${VpcOption}
    Label:
      zh-cn: 主交换机网段
      en: Primary VSwitch CIDR Block
    Description:
      zh-cn: 新建主交换机的网段
      en: CIDR block for new primary VSwitch


  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Required: true
    Default: NewOSS

  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}

Resources:
  # 新建VPC（当选择新建网关且新建VPC时）
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Fn::Sub: "${ALIYUN::StackName}-vpc"
      CidrBlock:
        Ref: VpcCidrBlock

  # 新建主VSwitch（当选择新建网关且新建VPC时）
  PrimaryEcsVSwitch:
    Type: ALIYUN::ECS::VSwitch
    Condition: CreateVpcConditions
    Properties:
      VSwitchName:
        Fn::Sub: "${ALIYUN::StackName}-primary-vswitch"
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: PrimaryZoneId
      CidrBlock:
        Ref: PrimaryVSwitchCidrBlock



  # 新建AI网关
  NewApigGateway:
    Type: ALIYUN::APIG::Gateway
    Condition: CreateGatewayConditions
    Properties:
      GatewayName:
        Ref: ALIYUN::StackName
      GatewayType: "AI"
      PaymentType:
        Ref: PayType
      Period:
        Ref: PayPeriod
      PeriodUnit:
        Ref: PayPeriodUnit
      Spec:
        Ref: GatewaySpec
      ZoneConfig:
        SelectOption: "Auto"
      NetworkAccessConfig:
        Type: "InternetAndIntranet"
      Vpc:
        VpcId:
          Fn::If:
            - CreateVpcConditions
            - Ref: EcsVpc
            - Ref: VpcId
      VSwitch:
        VSwitchId:
          Fn::If:
            - CreateVpcConditions
            - Ref: PrimaryEcsVSwitch
            - Ref: PrimaryVSwitchId

  # 查询网关详情，获取VPC、VSwitch、SecurityGroup等信息
  ApigGateway:
    Type: DATASOURCE::APIG::Gateway
    Properties:
      GatewayId:
        Ref: ActualGatewayId

  ExistVsw:
    Type: DATASOURCE::VPC::VSwitch
    Properties:
      VSwitchId:
        Fn::GetJsonValue:
          - VSwitchId
          - Fn::GetAtt:
              - ApigGateway
              - VSwitch

  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::GetJsonValue:
          - VpcId
          - Fn::GetAtt:
              - ApigGateway
              - Vpc
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 3000/3000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet

  # 创建OSS存储桶
  OSSBucket:
    Type: ALIYUN::OSS::Bucket
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      BucketName:
        Fn::Sub: "mcp-${ALIYUN::StackName}"
      Policy:
        Version: "1"
        Statement:
          - Effect: "Allow"
            Action:
              - "oss:GetObject"
              - "oss:PutObject"
              - "oss:GetObjectAcl"
              - "oss:PutObjectAcl"
              - "oss:AbortMultipartUpload"
              - "oss:ListParts"
              - "oss:RestoreObject"
              - "oss:GetVodPlaylist"
              - "oss:PostVodPlaylist"
              - "oss:PublishRtmpStream"
              - "oss:ListObjectVersions"
              - "oss:GetObjectVersion"
              - "oss:GetObjectVersionAcl"
              - "oss:RestoreObjectVersion"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}/*"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
          - Effect: "Allow"
            Action:
              - "oss:ListObjects"
            Principal:
              - Ref: ALIYUN::AccountId
            Resource:
              - Fn::Sub:
                  - "acs:oss:*:${TenantId}:${BucketName}"
                  - TenantId:
                      Ref: ALIYUN::TenantId
                    BucketName:
                      Fn::If:
                        - CreateOssConditions
                        - Fn::Sub: "mcp-${ALIYUN::StackName}"
                        - Ref: BucketName
            Condition:
              StringLike:
                "oss:Prefix":
                  - "*"

  # 创建FC角色（所有函数都使用此角色）
  FcRole:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Fn::Sub: "McpFcRole-${ALIYUN::StackName}"
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - fc.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Fn::Sub: "McpFcPolicy-${ALIYUN::StackName}"
          PolicyDocument:
            Statement:
              - Action:
                  - oss:GetObject
                  - oss:PutObject
                  - oss:ListObjects
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - "acs:oss:*:*:fc-layers-cn-hangzhou"
                  - "acs:oss:*:*:fc-layers-cn-hangzhou/*"
              - Action:
                  - vpc:DescribeVpcs
                  - vpc:DescribeVSwitches
                  - ecs:DescribeSecurityGroups
                Effect: Allow
                Resource:
                  - "*"
              - Action:
                  - apig:*
                Effect: Allow
                Resource:
                  - "*"
            Version: '1'



  McpFunctions:
    Type: ALIYUN::FC3::Function
    Count:
      Ref: McpConfigCount
    DependsOn:
      - ApigGateway
      - FcRole
    Properties:
      FunctionName:
        Fn::Sub:
          - "${ALIYUN::StackName}-${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Handler: "index.handler"
      Runtime: "custom.debian12"
      MemorySize: 1024
      DiskSize: 512
      Timeout: 60
      InstanceConcurrency: 20
      InternetAccess: true
      Cpu: 1
      # 角色：所有函数都使用创建的角色
      SessionAffinity: MCP_SSE
      SessionAffinityConfig:
        SseEndpointPath: /sse
        SessionConcurrencyPerInstance: 20
      Role:
        Fn::GetAtt:
          - FcRole
          - Arn
      Layers:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Ref: LayersArray
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      Code:
        # OSS桶名：私有包使用创建的OSS，公开包使用默认OSS
        OssBucketName:
          Fn::Jq:
            - First
            - Fn::Sub:
                - |
                  if (.command == "npx" and .pkgType == "private") or (.command == "uvx" and .pkgType == "private") then 
                    "${BucketName}" 
                  else 
                    "fc-layers-cn-hangzhou" 
                  end
                - BucketName:
                    Ref: OssBucketName
            - Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: McpConfigJson
        # OSS对象名：使用预构建的对象名数组
        OssObjectName:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: OssObjectNameArray
      # OSS挂载配置：所有函数都挂载OSS到统一路径
      OssMountConfig:
        MountPoints:
          - BucketName:
              Ref: OssBucketName
            BucketPath: "/mcp-package"
            ReadOnly: true
            MountDir: "/home/app"
            Endpoint: "https://oss-cn-hangzhou.aliyuncs.com"
      CustomRuntimeConfig:
        Port: 8080
        Command:
          Fn::Select:
            - Ref: ALIYUN::Index
            - Ref: CommandArray
      # VPC配置 - 直接使用网关的VPC信息
      VpcConfig:
        VpcId:
          Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc
        VSwitchIds:
          Fn::ListMerge:
            - - Fn::GetJsonValue:
                  - VSwitchId
                  - Fn::GetAtt:
                      - ApigGateway
                      - VSwitch
        SecurityGroupId:
          Ref: SecurityGroup
      # 环境变量配置
      EnvironmentVariables:
        Fn::Jq:
          - First
          - Fn::Sub:
              - |
                . as $config | {
                  "LD_LIBRARY_PATH": "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib",
                  "PATH": (
                    if $config.command == "npx" then 
                      "/var/fc/lang/nodejs22/bin:/var/fc/lang/python3.13/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    else 
                      "/var/fc/lang/python3.13/bin:/var/fc/lang/nodejs22/bin:/usr/local/bin/apache-maven/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/local/ruby/bin:/opt/bin:/code:/code/bin" 
                    end
                  ),
                  "PYTHONPATH": "/opt/python:/code",
                  "NODE_PATH": (
                    if $config.command == "npx" then 
                      "/opt/nodejs/node_modules" 
                    else 
                      null 
                    end
                  ),
                  "DEPLOY_TIME": "${DeployTime}",
                  "SERVER_CODE": $config.serverCode,
                  "CONFIG_TYPE": (
                    if $config.command == null then "sse" 
                    elif $config.command == "npx" and ($config.pkgType == "private") then "npx-private" 
                    elif $config.command == "npx" then "npx-public" 
                    elif $config.command == "uvx" and ($config.pkgType == "private") then "uvx-private" 
                    elif $config.command == "uvx" then "uvx-public" 
                    else "sse" 
                    end
                  )
                } + ($config.env // {})
              - DeployTime:
                  Ref: CurTime
          - Fn::Select:
              - Ref: ALIYUN::Index
              - Ref: McpConfigJson

  McpTriggers:
    Type: ALIYUN::FC3::Trigger
    Count:
      Ref: McpConfigCount
    DependsOn: McpFunctions
    Properties:
      FunctionName:
        Fn::Select:
          - Ref: ALIYUN::Index
          - Fn::GetAtt:
              - McpFunctions
              - FunctionName
      TriggerType: "http"
      TriggerName: "defaultTrigger"
      Qualifier: "LATEST"
      Description:
        Fn::Sub:
          - "${ServerCode}"
          - ServerCode:
              Fn::Select:
                - Ref: ALIYUN::Index
                - Ref: ServerCodeArray
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
          - "PUT"
          - "DELETE"
          - "OPTIONS"
        disableURLInternet: false

  # MCP注册函数
  McpRegistrationFunction:
    Type: ALIYUN::FC3::Function
    DependsOn:
      - ApigGateway
      - FcRole
      - OSSBucket  # 如果创建新OSS
    Properties:
      FunctionName:
        Fn::Sub: "mcp-registration-${ALIYUN::StackName}"
      Handler: "fc-mcp.handler"
      LogConfig:
        Logstore: default-logs
        Project: serverless-cn-hangzhou-4631c296-3cd7-53fb-a3c3-d39cf985a3d3
        EnableRequestMetrics: true
        EnableInstanceMetrics: true
        LogBeginRule: DefaultRegex
      Runtime: "python3.12"
      MemorySize: 512
      DiskSize: 512
      Timeout: 300  # 5分钟超时，足够处理批量注册
      InstanceConcurrency: 1
      InternetAccess: true
      Cpu: 0.5
      Role:
        Fn::GetAtt:
          - FcRole
          - Arn
      Layers:
        - "acs:fc:cn-hangzhou:1563457855438522:layers/alibabacloud_apig20240327/versions/9"
      Description: "apig registration"
      Code:
        # 使用创建的OSS桶
        OssBucketName: service-info-public
        OssObjectName: "mcp/fc-mcp.py.zip"  # 需要先上传oss.py到OSS
      # VPC配置 - 使用网关的VPC信息
      VpcConfig:
        VpcId:
          Fn::GetJsonValue:
            - VpcId
            - Fn::GetAtt:
                - ApigGateway
                - Vpc
        VSwitchIds:
          Fn::ListMerge:
            - - Fn::GetJsonValue:
                  - VSwitchId
                  - Fn::GetAtt:
                      - ApigGateway
                      - VSwitch
        SecurityGroupId:
          Ref: SecurityGroup
      # 环境变量
      EnvironmentVariables:
        PYTHONPATH: "/opt/python:/code"
        LD_LIBRARY_PATH: "/code:/code/lib:/usr/lib:/opt/lib:/usr/local/lib"

  McpRegistrationTrigger:
    Type: ALIYUN::FC3::Trigger
    DependsOn: McpRegistrationFunction
    Properties:
      FunctionName:
        Fn::GetAtt:
          - McpRegistrationFunction
          - FunctionName
      TriggerType: "http"
      TriggerName: "registrationTrigger"
      Qualifier: "LATEST"
      Description: "mcp"
      TriggerConfig:
        authType: "anonymous"
        methods:
          - "GET"
          - "POST"
        disableURLInternet: false

  # MCP服务注册调用器
  McpRegistrationInvoker:
    Type: ALIYUN::FC3::FunctionInvoker
    DependsOn:
      - McpRegistrationFunction
      - McpFunctions
    Properties:
      FunctionName:
        Fn::GetAtt:
          - McpRegistrationFunction
          - FunctionName
      Async: false
      CheckError: true
      ExecuteVersion: 0
      Event:
        Ref: RegistrationEvent
      Qualifier: "LATEST"



Outputs:
  # MCP管控平台链接
  mcp_control_plane:
    Label:
      en: 'MCP Control Plane'
      zh-cn: MCP管控平台
    Value:
      Fn::Sub:
        - 'https://apig.console.aliyun.com/#/${RegionId}/ai-gateway/${GatewayId}/mcp-server?region=${RegionId}'
        - RegionId:
            Ref: ALIYUN::Region
          GatewayId:
            Ref: ActualGatewayId

Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - McpConfigJson
        Label:
          default:
            zh-cn: MCP服务配置
            en: MCP Service Configuration
      - Parameters:
          - GatewayOption
          - HigressAI
          - HigressDomainId
          - GatewaySpec
          - PayType
          - PayPeriodUnit
          - PayPeriod
          - PrimaryZoneId
        Label:
          default:
            zh-cn: AI网关配置
            en: AI Gateway Configuration
      - Parameters:
          - VpcOption
          - VpcId
          - PrimaryVSwitchId
          - VpcCidrBlock
          - PrimaryVSwitchCidrBlock
        Label:
          default:
            zh-cn: 网络配置
            en: Network Configuration
      - Parameters:
          - OssOption
          - BucketName
        Label:
          default:
            zh-cn: OSS存储配置
            en: OSS Storage Configuration
