ROSTemplateFormatVersion: '2015-09-01'
Locals:
  CurTime:
    Type: Eval
    Value:
      Fn::FormatTime:
        - '%Y%m%d-%H%M%S'
        - Asia/Shanghai
Conditions:
  EnableAuthenticationConditions:
    Fn::Equals:
      - Enable
      - Ref: AuthenticationOption
  EnablePublicAccess:
    Fn::Equals:
      - True
      - Ref: SupportPublicAccess
  DisablePublicAccess:
    Fn::Equals:
      - False
      - Ref: SupportPublicAccess
  CreateVpcConditions:
    Fn::Equals:
      - NewVPC
      - Ref: VpcOption
  CreateSecurityGroupConditions:
    Fn::Equals:
      - NewSecurityGroup
      - Ref: SecurityGroupOption
  CreateOssConditions:
    Fn::Equals:
      - NewOSS
      - Ref: OssOption
Parameters:
  SupportPublicAccess:
    Type: Boolean
    Label:
      zh-cn: 支持公网访问
      en: Support Public Access
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::And:
            - Fn::Equals:
                - ExistingVPC
                - ${VpcOption}
            - Fn::Equals:
                - ExistingSecurityGroup
                - ${SecurityGroupOption}
    Default: True

  AuthenticationOption:
    Type: String
    Label: 是否开启认证
    AllowedValues:
      - Enable
      - Disable
    AssociationPropertyMetadata:
      ValueLabelMapping:
        Enable:
          zh-cn: 开启认证
          en: Enable Authentication
        Disable:
          zh-cn: 关闭认证
          en: Disable Authentication
    Default: Enable
  InternetMaxBandwidthOut:
    Type: Number
    Label:
      zh-cn: 公网带宽 (Mbps)-推荐8Mbps
      en: Internet Max Bandwidth Out (Mbps)-Recommended 8Mbps
    MinValue: 1
    MaxValue: 100
    Default: 8
  InternetChargeType:
    Type: String
    Label:
      zh-cn: 带宽付费类型
      en: Internet Charge Type
    AssociationPropertyMetadata:
      ValueLabelMapping:
        PayByTraffic: 按流量计费
        PayByBandwidth: 按固定带宽计费
    AllowedValues:
      - PayByBandwidth
      - PayByTraffic
    Default: PayByTraffic
  McpConfigJson:
    Type: Json
    Label:
      zh-cn: MCP运行配置
      en: MCP Running Configuration
    AssociationProperty: 'ALIYUN::MCP::Server::Server'
    AssociationPropertyMetadata:
      ShowLabel: false
      ShowCounts: 9
      ShowTagsCounts: 10
  VpcOption:
    Type: String
    AllowedValues:
      - NewVPC
      - ExistingVPC
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewVPC:
          zh-cn: 新建专有网络
          en: New VPC
        ExistingVPC:
          zh-cn: 已有专有网络
          en: Existing VPC
    Label:
      en: Select Existing or New VPC
      zh-cn: 选择已有/新建的专有网络
    Required: true
    Default: NewVPC
  VpcCidrBlock:
    Type: String
    Label:
      en: VPC CIDR IPv4 Block
      zh-cn: 专有网络IPv4网段
    Description:
      zh-cn: VPC的ip地址段范围，<br>您可以使用以下的ip地址段或其子网:<br><font color='green'>[10.0.0.0/8]</font><br><font color='green'>[172.16.0.0/12]</font><br><font color='green'>[192.168.0.0/16]</font>
      en: 'The ip address range of the VPC in the CidrBlock form; <br>You can use the following ip address ranges and their subnets: <br><font color=''green''>[10.0.0.0/8]</font><br><font color=''green''>[172.16.0.0/12]</font><br><font color=''green''>[192.168.0.0/16]</font>'
    Default: 192.168.0.0/16
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VPC::CidrBlock
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  VSwitchCidrBlock:
    Type: String
    Label:
      en: VSwitch CIDR Block
      zh-cn: 交换机子网网段
    Description:
      zh-cn: 必须属于VPC的子网段。
      en: Must belong to the subnet segment of VPC.
    Default: 192.168.1.0/24
    Required:
      Fn::Equals:
        - NewVPC
        - ${VpcOption}
    AssociationProperty: ALIYUN::VPC::VSwitch::CidrBlock
    AssociationPropertyMetadata:
      VpcCidrBlock: VpcCidrBlock
      Visible:
        Condition:
          Fn::Equals:
            - NewVPC
            - ${VpcOption}
  PayType:
    Type: String
    Label:
      en: ECS Instance Charge Type
      zh-cn: 付费类型
    Default: PostPaid
    AllowedValues:
      - PostPaid
      - PrePaid
    AssociationProperty: ChargeType
    AssociationPropertyMetadata:
      LocaleKey: InstanceChargeType
  PayPeriodUnit:
    Type: String
    Label:
      en: Pay Period Unit
      zh-cn: 购买资源时长周期
    Default: Month
    AllowedValues:
      - Month
      - Year
    AssociationProperty: PayPeriodUnit
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  PayPeriod:
    Type: Number
    Label:
      en: Period
      zh-cn: 购买资源时长
    Default: 1
    AllowedValues:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8
      - 9
    AssociationProperty: PayPeriod
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Not:
            Fn::Equals:
              - ${PayType}
              - PostPaid
  EcsInstanceType:
    Type: String
    Label:
      en: Instance Type
      zh-cn: 实例类型
    AssociationProperty: ALIYUN::ECS::Instance::InstanceType
    AllowedValues:
      - ecs.u1-c1m4.large
      - ecs.u1-c1m1.xlarge
      - ecs.u1-c1m2.xlarge
      - ecs.u1-c1m4.xlarge
      - ecs.u1-c1m1.2xlarge
      - ecs.u1-c1m2.3xlarge
      - ecs.u1-c1m1.4xlarge
      - ecs.e-c1m2.xlarge
      - ecs.e-c1m4.large
    AssociationPropertyMetadata:
      InstanceChargeType: ${PayType}
    Default: ecs.u1-c1m1.xlarge

  ZoneId:
    Type: String
    Label:
      en: Zone ID
      zh-cn: 可用区ID
    AssociationProperty: ALIYUN::ECS::Instance::ZoneId
    AssociationPropertyMetadata:
      DefaultValueStrategy: random
      InstanceChargeType: ${PayType}
      SystemDiskCategory: cloud_essd
      InstanceType: ${EcsInstanceType}
  VpcId:
    Type: String
    Label:
      en: VPC ID
      zh-cn: 专有网络VPC实例ID
    AssociationProperty: 'ALIYUN::ECS::VPC::VPCId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: ''
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  VSwitchId:
    Type: String
    Label:
      en: VSwitch ID
      zh-cn: 交换机实例ID
    Default: ''
    AssociationProperty: 'ALIYUN::ECS::VSwitch::VSwitchId'
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    AssociationPropertyMetadata:
      AutoSelectFirst: true
      VpcId: ${VpcId}
      ZoneId: ${ZoneId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
  SecurityGroupOption:
    Type: String
    AllowedValues:
      - NewSecurityGroup
      - ExistingSecurityGroup
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingVPC
            - ${VpcOption}
      ValueLabelMapping:
        NewSecurityGroup:
          zh-cn: 新建安全组
          en: New SecurityGroup
        ExistingSecurityGroup:
          zh-cn: 已有安全组
          en: Existing SecurityGroup
    Label:
      en: Select Existing or SecurityGroup
      zh-cn: 选择已有/新建的安全组
    Required:
      Fn::Equals:
        - ExistingVPC
        - ${VpcOption}
    Default: NewSecurityGroup
  SecurityGroupId:
    Type: String
    Label:
      en: SecurityGroup ID
      zh-cn: 安全组实例ID
    Required:
      Fn::Equals:
        - ExistingSecurityGroup
        - ${SecurityGroupOption}
    Default: ''
    AssociationProperty: ALIYUN::ECS::SecurityGroup::SecurityGroupId
    AssociationPropertyMetadata:
      VpcId: ${VpcId}
      Visible:
        Condition:
          Fn::Equals:
            - ExistingSecurityGroup
            - ${SecurityGroupOption}
  OssOption:
    Type: String
    AllowedValues:
      - NewOSS
      - ExistingOSS
    AssociationPropertyMetadata:
      ValueLabelMapping:
        NewOSS:
          zh-cn: 新建OSS存储桶
          en: New OSS Bucket
        ExistingOSS:
          zh-cn: 已有OSS存储桶
          en: Existing OSS Bucket
    Label:
      en: Select Existing or New OSS Bucket
      zh-cn: 选择已有/新建的OSS存储桶
    Required: true
    Default: NewOSS
  BucketName:
    Type: String
    Label:
      en: OSS Bucket Name
      zh-cn: OSS存储桶名称
    Required:
      Fn::Equals:
        - ExistingOSS
        - ${OssOption}
    Default: ''
    AssociationProperty: ALIYUN::OSS::Bucket::BucketName
    AssociationPropertyMetadata:
      Visible:
        Condition:
          Fn::Equals:
            - ExistingOSS
            - ${OssOption}
Resources:
  OSSBucket:
    Type: 'ALIYUN::OSS::Bucket'
    Condition: CreateOssConditions
    Properties:
      DeletionForce: true
      BucketName:
        Fn::If:
          - CreateOssConditions
          - Ref: ALIYUN::StackName
          - Ref: BucketName
  OSSRamUser:
    Type: ALIYUN::RAM::Role
    Properties:
      RoleName:
        Ref: ALIYUN::StackName
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - ecs.aliyuncs.com
        Version: '1'
      Policies:
        - PolicyName:
            Ref: ALIYUN::StackName
          PolicyDocument:
            Statement:
              - Action:
                  - ram:CreateServiceLinkedRole
                Resource:
                  - '*'
                Effect: Allow
                Condition:
                  StringEquals:
                    ram:ServiceName:
                      - supplier.computenest.aliyuncs.com
              - Action:
                  - oss:*
                Effect: Allow
                Resource:
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
                  - Fn::Sub:
                      - "acs:oss:*:*:${BucketName}/*"
                      - BucketName:
                          Fn::If:
                            - CreateOssConditions
                            - Fn::GetAtt:
                                - OSSBucket
                                - Name
                            - Ref: BucketName
            Version: '1'
  MCP_KEY:
    Type: ALIYUN::RandomString
    Properties:
      length: 29
      character_classes:
        - class: lowercase
          min: 1
        - class: digits
          min: 1
  RandomPassword:
    Type: ALIYUN::RandomString
    Properties:
      length: 11
      character_classes:
        - class: "lowercase"
          min: 4
        - class: "uppercase"
          min: 4
        - class: "digits"
          min: 2
      character_sequences:
        - sequence: "!@#$^*-+="
  # 新建vpc
  EcsVpc:
    Type: ALIYUN::ECS::VPC
    Condition: CreateVpcConditions
    Properties:
      VpcName:
        Ref: ALIYUN::StackName
      CidrBlock:
        Ref: VpcCidrBlock
  # 新建vswitch
  EcsVSwitch:
    Condition: CreateVpcConditions
    Type: ALIYUN::ECS::VSwitch
    Properties:
      VSwitchName:
        Ref: ALIYUN::StackName
      VpcId:
        Ref: EcsVpc
      ZoneId:
        Ref: ZoneId
      CidrBlock:
        Ref: VSwitchCidrBlock
  SecurityGroup:
    Type: ALIYUN::ECS::SecurityGroup
    Condition: CreateSecurityGroupConditions
    Properties:
      SecurityGroupName:
        Ref: ALIYUN::StackName
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      SecurityGroupIngress:
        - PortRange: 8000/8000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8080/8080
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8001/8001
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 8443/8443
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
        - PortRange: 3000/3000
          Priority: 1
          SourceCidrIp: 0.0.0.0/0
          IpProtocol: tcp
          NicType: internet
  InstanceGroup:
    Type: ALIYUN::ECS::InstanceGroup
    Properties:
      # 付费类型
      InstanceChargeType:
        Ref: PayType
      PeriodUnit:
        Ref: PayPeriodUnit
      Period:
        Ref: PayPeriod
      VpcId:
        Fn::If:
          - CreateVpcConditions
          - Ref: EcsVpc
          - Ref: VpcId
      VSwitchId:
        'Fn::If':
          - CreateVpcConditions
          - Ref: EcsVSwitch
          - Ref: VSwitchId
      ZoneId:
        Ref: ZoneId
      SecurityGroupId:
        Fn::If:
          - CreateSecurityGroupConditions
          - Ref: SecurityGroup
          - Ref: SecurityGroupId
      ImageId: ecs_image_quickstart-mcp
      Password:
        Fn::GetAtt:
          - RandomPassword
          - value
      InstanceType:
        Ref: EcsInstanceType
      SystemDiskCategory: cloud_essd
      SystemDiskSize: 40
      RamRoleName:
        Fn::GetAtt:
          - OSSRamUser
          - RoleName
      InternetMaxBandwidthOut:
        Fn::If:
          - EnablePublicAccess
          - Ref: InternetMaxBandwidthOut
          - 0
      InternetChargeType:
        Ref: InternetChargeType
      IoOptimized: optimized
      MaxAmount: 1
  RunInstallCommand:
    Type: ALIYUN::ECS::RunCommand
    DependsOn:
      - OSSRamUser
    Properties:
      InstanceIds:
        Fn::GetAtt:
          - InstanceGroup
          - InstanceIds
      Type: RunShellScript
      Sync: true
      Timeout: 3600
      CommandContent:
        Fn::Sub:
          - |
            set -e
            echo "当前时间：${CurTime}"
            wget -O /root/pre-mcp-tools.json https://service-info-public.oss-cn-hangzhou.aliyuncs.com/mcp/mcp-tools.json
                        cd /root/application/mcp

            # 创建本地包目录（不存在才创建）
            mkdir -p /root/mcp-package
            chmod -R 777 /root/mcp-package
            
                        # 静默卸载 aliyun-cli
            yum remove aliyun-cli -y

            # 静默下载 aliyun-cli
            curl -s https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz -o aliyun-cli-linux-latest.tgz

            # 静默解压 aliyun-cli
            tar xzf aliyun-cli-linux-latest.tgz
            ./aliyun configure set \
            --profile EcsProfile \
            --mode EcsRamRole \
            --ram-role-name ${RamRoleName} \
            --region ${RegionId}
            
            # 前置条件检查和ossutil安装
            if ! command -v ossutil &> /dev/null; then
              echo "安装ossutil..."
              curl -o ossutil-2.1.1-linux-amd64.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.1/ossutil-2.1.1-linux-amd64.zip
              unzip ossutil-2.1.1-linux-amd64.zip
              cd ossutil-2.1.1-linux-amd64
              chmod 755 ossutil
              sudo mv ossutil /usr/local/bin/ && sudo ln -s /usr/local/bin/ossutil /usr/bin/ossutil
            fi
          
            
            # 配置ossutil（通过实例RAM角色）
            if [ ! -f ~/.ossutilconfig ]; then
              echo "配置ossutil..."
            cat > ~/.ossutilconfig << EOF
            [Credentials]
            endpoint = oss-${RegionId}-internal.aliyuncs.com
            region = ${RegionId}
            mode = EcsRamRole
            ecsRoleName = ${RamRoleName}
            EOF
            fi

            
            cpu_cores=$(nproc)
            if [ $cpu_cores -eq 4 ]; then
              workers=1
            elif [ $cpu_cores -le 4 ]; then
              workers=1
            else
              workers=$((cpu_cores / 2))
            fi
            cd /root
            cat > config.json << EOF
            ${MCP_RESULT}
            EOF
            set +e
            cd /root/application/mcp
            echo "开始下载MCP服务器包..."
            python download_oss.py '${bucketName}' /root/config.json
            download_result=$?
            set -e
            sed -i "s|\${!MCP_KEY:-}|${mcp_KEY}|g" /root/application/mcp/docker-compose.yaml
            sed -i "s|\${!MCPO_WORKERS:-4}|${!workers}|g" /root/application/mcp/docker-compose.yaml
            sed -i "s|\${!PUBLIC_IP:-}|${public_ip_no_port}|g" /root/application/mcp/docker-compose.yaml
            sed -i "s|\${!PRIVATE_IP:-}|${private_ip_no_port}|g" /root/application/mcp/docker-compose.yaml

            file_path="/etc/systemd/system/quickstart-mcp.service"
            if [ ! -f "$file_path" ]; then
            cat > $file_path <<EOF
            [Unit]
            Description=Docker Compose Application Service
            Requires=docker.service
            After=docker.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            WorkingDirectory=/root/application/mcp
            ExecStart=/usr/bin/docker compose -f docker-compose.yaml up -d
            ExecStop=/usr/bin/docker compose down
            TimeoutStartSec=0

            [Install]
            WantedBy=multi-user.target
            EOF

            systemctl enable quickstart-mcp
            
            fi
            systemctl daemon-reload
            systemctl restart quickstart-mcp
            cd /root/application/mcp

            MAX_TIMEOUT=1800
            INTERVAL=10
            MAX_ATTEMPTS=$((MAX_TIMEOUT / INTERVAL))
            
            for ((i=1; i<=MAX_ATTEMPTS; i++))
              do
                if [ -f "/root/application/mcp/logs/mcpo.log" ]; then
                  LATEST_LOG=$(tail -n 10 /root/application/mcp/logs/mcpo.log 2>/dev/null)
                  if echo "$LATEST_LOG" | grep -q "Application startup complete"
                    then
                      echo "success"
                      break
                    else
                      sleep $INTERVAL
                  fi
                else
                  sleep $INTERVAL
                fi
            done
            for ((i=1; i<=MAX_ATTEMPTS; i++))
              do
                LATEST_LOG=$(docker logs higress-ai 2>&1 | tail -n 10)
                if echo "$LATEST_LOG" | grep -q "grafana entered RUNNING state"
                  then
                    echo "success"
                    break
                  else
                    sleep $INTERVAL
              fi
            done
            sleep 15
            
            chmod +x /root/application/mcp/openapi-to-mcp   
            # 测试
            python higress_client.py ${mcp_KEY_command} --domain ${private_ip} --config /root/config.json ${auth}
            sleep 10

          - RegionId:
              Ref: ALIYUN::Region
            mcp_KEY:
              Fn::Join:
                - '-'
                - - 'sk'
                  - Fn::GetAtt:
                      - MCP_KEY
                      - value
            CurTime:
              Ref: CurTime
            mcp_KEY_command:
              Fn::If:
                - EnableAuthenticationConditions
                - Fn::Sub:
                    - "--api-key ${key}"
                    - key:
                        Fn::Join:
                          - '-'
                          - - 'sk'
                            - Fn::GetAtt:
                                - MCP_KEY
                                - value
                - ""
            MCP_RESULT:
              Fn::Jq:
                - "First"
                - '{mcpServers: map({ key: .serverCode, value: { command, args, env,type,url,packageOssPath,icon } }) | from_entries }'
                - Ref: McpConfigJson

            OSS_JSON:
              Fn::Jq:
                - "First"
                - '{mcpServers: map({ key: .serverCode, value: { command, args, env,type,url,packageOssPath,packageOssPath,icon } }) | from_entries }'
                - Ref: McpConfigJson
            private_ip:
              Fn::Sub:
                - ${ServerAddress}:8000
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PrivateIps
            private_ip_no_port:
              Fn::Sub:
                - ${ServerAddress}
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PrivateIps
            public_ip_no_port:
              Fn::Sub:
                - ${ServerAddress}
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PublicIps
            public_ip:
              Fn::Sub:
                - ${ServerAddress}:8000
                - ServerAddress:
                    Fn::Select:
                      - 0
                      - Fn::GetAtt:
                          - InstanceGroup
                          - PublicIps
            auth:
              Fn::If:
                - EnableAuthenticationConditions
                - ""
                - "--skip-auth"
            bucketName:
              Fn::If:
                - CreateOssConditions
                - Fn::GetAtt:
                    - OSSBucket
                    - Name
                - Ref: BucketName
            RamRoleName:
              Fn::GetAtt:
                - OSSRamUser
                - RoleName

Outputs:
  EcsInitialPassword:
    NoEcho: true
    Label:
      en: "ECS Initial Password"
      zh-cn: ECS初始密码
    Value:
      Fn::GetAtt:
        - RandomPassword
        - value
  openapi_server_address:
    Condition: EnablePublicAccess
    Label:
      en: "MCP Server control plane"
      zh-cn: MCP Server总览控制台
    Value:
      Fn::Sub:
        - http://${ServerAddress}:3000
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - InstanceGroup
                  - PublicIps
  openapi_server_inner_address:
    Condition: DisablePublicAccess
    Label:
      en: "MCP Server control plane"
      zh-cn: MCP Server总览控制台(内网访问)
    Value:
      Fn::Sub:
        - http://${ServerAddress}:3000
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - InstanceGroup
                  - PrivateIps
  ApiKey:
    NoEcho: true
    Condition: EnableAuthenticationConditions
    Label: API Key
    Value:
      Fn::Join:
        - '-'
        - - 'sk'
          - Fn::GetAtt:
              - MCP_KEY
              - value
  DebugConsole:
    Label:
      en: "MCP Server Debug Console"
      zh-cn: MCP Server调试控制台
    Condition: EnablePublicAccess
    Value:
      Fn::Sub:
        - http://${ServerAddress}:8000/docs
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - InstanceGroup
                  - PublicIps
  DebugInnerConsole:
    Label:
      en: "MCP Server Debug Console"
      zh-cn: MCP Server调试内网控制台
    Condition: DisablePublicAccess
    Value:
      Fn::Sub:
        - http://${ServerAddress}:8000/docs
        - ServerAddress:
            Fn::Select:
              - 0
              - Fn::GetAtt:
                  - InstanceGroup
                  - PrivateIps

Metadata:
  ALIYUN::ROS::Interface:
    ParameterGroups:
      - Parameters:
          - McpConfigJson
          - AuthenticationOption
        Label:
          Default: Mcp配置(可多选，10个以内)
      - Parameters:
          - OssOption
          - BucketName
        Label:
          Default: OSS存储配置
      - Parameters:
          - PayType
          - PayPeriodUnit
          - PayPeriod
        Label:
          default: 付费类型配置
      - Parameters:
          - EcsInstanceType
          - NetworkOption
          - InternetChargeType
          - InternetMaxBandwidthOut
        Label:
          default: 资源配置
      - Parameters:
