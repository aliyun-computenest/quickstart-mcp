Service:
  RegionId: cn-hangzhou
  DeployType: ros
  OperationMetadata:
    StatusOperationConfigs:
    - TemplateName: ECS单机版
      SupportOperations:
      - Start
      - Stop
      - Restart
    - TemplateName: 企业版
      SupportOperations:
      - Start
      - Stop
      - Restart
    SupportBackup: true
    ModifyParametersConfig:
    - TemplateName: ECS单机版
      Operation:
      - Name: 变更ECS实例规格
        Description: 变更ECS实例规格
        Type: Custom
        Parameters:
        - EcsInstanceType
      - Name: Modify-MCP-Servers
        Description: 修改已部署的MCP工具
        Type: Custom
        SupportPredefinedParameters: false
        EnableLogging: false
        Parameters:
        - McpConfigJson
    - TemplateName: 企业版
      Operation:
      - Name: 变更ECS实例规格
        Description: 变更ECS实例规格
        Type: Custom
        Parameters:
        - EcsInstanceType
      - Name: Modify-MCP-Servers
        Description: 修改已部署的MCP工具（10个以内）
        Type: Custom
        SupportPredefinedParameters: false
        EnableLogging: false
        Parameters:
        - McpConfigJson
  DeployMetadata:
    SupplierDeployMetadata:
      SupplierTemplateConfigs:
      - Name: ECS单机版
        Url: 'ros_templates/template.yaml'
        ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
        AllowedRegions:
        - ap-southeast-1
      - Name: 企业版
        Url: 'ros_templates/template-enterprise.yaml'
        ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
        AllowedRegions:
        - ap-southeast-1
      ArtifactRelation:
        ecs_image_quickstart-mcp:
          ArtifactId: ${Artifact.EcsImage.ArtifactId}
          ArtifactVersion: draft
    TemplateConfigs:
    - Name: ECS单机版
      Url: 'ros_templates/template.yaml'
      ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
      AllowedRegions:
      - ap-southeast-1
      OutputConfigs:
      - OutputKey: DebugInnerConsole
        EnableWebProxy: true
      - OutputKey: openapi_server_inner_address
        EnableWebProxy: true
    - Name: 企业版
      Url: 'ros_templates/template-enterprise.yaml'
      ArchitectureDiagramUrl: 'resources/architecture/architecture.jpg'
      AllowedRegions:
      - ap-southeast-1
    ServiceInstanceNameRule:
      Prefix: mcp-
      UseDefaultValue: true
  ServiceType: private
  ServiceInfo:
    # 英文版可以再配置Locale为en-US的服务信息
  - Locale: zh-CN
    Name: MCP Server
    ShortDescription: 阿里云计算巢MCP市场 - 企业级AI工具生态平台。海量MCP工具生态：提供数百个即用型MCP工具，涵盖搜索、开发、自动化等各类场景 灵活部署方案。数据安全保障工具部署在用户云账号下，确保数据主权与合规要求 从单一工具到完整生态，从概念验证到生产就绪 - 这里是您的AI工具超市。
    Image: 
      https://service-info-public.oss-cn-hangzhou.aliyuncs.com/1853370294850618/service-image/ba45d5c8-8654-44a9-a60a-a3090a958c77.png
    Softwares:
    - Name: mcpo
      Version: 0.0.12
      Locale: zh-CN
    - Name: higress
      Version: 2.1.4
      Locale: zh-CN
Artifact:
  EcsImage:
    ArtifactType: EcsImage
    ArtifactName: ecs_image_quickstart-mcp
    Description: quickstart-mcp EcsImage
    SupportRegionIds:
    - ap-southeast-1
    ArtifactBuildProperty:
      CodeRepo:
        Platform: github
        Owner: LYH-RAIN
        RepoName: aliyun-computenest/quickstart-mcp
        Branch: main
      RegionId: ap-southeast-1
      CommandType: RunShellScript
      SourceImageId: aliyun_3_x64_20G_alibase_20240819.vhd
      CommandContent: |-
        # go环境没有docker
        yum-config-manager --add-repo http://mirrors.aliyun.com/docker-ce/linux/centos/docker-ce.repo
        yum makecache
        yum install -y wget curl unzip git jq
        yum install -y docker-ce
        systemctl start docker || error "启动 Docker 服务失败"
        systemctl enable docker || warn "设置 Docker 开机自启动失败"
        sleep 20
        mkdir -p /root/application
        yum install jq -y
        if [ -e "/root/code/mcp/" ]; then cp -r "/root/code/mcp/" "/root/application/"; fi
        cd /root/application
        sed -i 's/pull_policy: always/pull_policy: if_not_present/g' mcp/docker-compose.yaml
        docker compose -f mcp/docker-compose.yaml build --no-cache 2>&1 | stdbuf -oL grep -viE 'Downloading|sha256|extracting|KiB|Downloaded|%' || true;
        docker compose -f mcp/docker-compose.yaml pull 2>&1 | stdbuf -oL grep -viE 'Downloading|sha256|extracting|KiB|Downloaded|%' || true;


