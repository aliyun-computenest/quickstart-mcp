version: '3.8'

services:
  # MCP Hub 前端应用
  mcp-hub:
    container_name: mcp-hub
    build:
      context: .
      dockerfile: Dockerfile-hub
    ports:
      - "3000:3000"
    environment:
      # 服务器连接配置（IP、Token等）
      - PUBLIC_IP=${PUBLIC_IP:-}
      - PRIVATE_IP=${PRIVATE_IP:-}
      - PUBLIC_TOKEN=${MCP_KEY:-}
      - PRIVATE_TOKEN=${MCP_KEY:-}
      - USE_PUBLIC_IP=${USE_PUBLIC_IP:-true}

    volumes:
      # 挂载 MCP 配置文件到正确的位置
      - /root/config.json:/app/dist/config.json
      - /root/pre-mcp-tools.json:/app/dist/config_detail.json
    restart: unless-stopped
    networks:
      - mcp-network
    labels:
      - "com.github.repo=aliyun-computenest/mcp-hub"
      - "com.docker.compose.project=mcp-hub"

  # MCPO 服务
  mcpo-service:
    depends_on:
      - higress-ai
    container_name: mcpo-service
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - /root/config.json:/app/config.json
      - /root/mcp-package:/mcp-package
      - ./logs:/app/logs  # 挂载本地目录到容器内的日志目录
    restart: unless-stopped
    environment:
      API_KEY: ${MCP_KEY:-}
      PORT: 8000
      HOST: "0.0.0.0"
      CONFIG_FILE: /app/config.json
      WORKERS: ${MCPO_WORKERS:-4}
    networks:
      - mcp-network

  # Higress AI 服务
  higress-ai:
    depends_on:
      - higress-redis
    container_name: higress-ai
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    volumes:
      - ./:/data
    ports:
      - "8001:8001"
      - "8080:8080"
      - "8443:8443"
    restart: unless-stopped
    networks:
      - mcp-network

  # Redis 服务
  higress-redis:
    container_name: higress-redis
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/redis-stack-server:7.4.0-v3
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge
    name: mcp-hub-network